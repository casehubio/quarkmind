<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="system-ui, -apple-system, sans-serif">
  <style>
    text { fill: #0b0b0b; }
    .label { font-size: 11px; fill: #52514e; }
    .value { font-size: 12px; font-weight: 600; }
    .title { font-size: 15px; font-weight: 600; }
    .subtitle { font-size: 12px; fill: #52514e; }
    .axis-label { font-size: 10px; fill: #52514e; }
    .bar { fill: #2a78d6; }
    .bar-spread { fill: #1baf7a; }
    .grid { stroke: #e8e8e5; stroke-width: 1; }
    .threshold { stroke: #eb6834; stroke-width: 1.5; stroke-dasharray: 6,4; }
    .threshold-label { font-size: 10px; fill: #eb6834; font-weight: 600; }
    @media (prefers-color-scheme: dark) {
      text { fill: #f0efec; }
      .label { fill: #c3c2b7; }
      .subtitle { fill: #c3c2b7; }
      .axis-label { fill: #c3c2b7; }
      .grid { stroke: #333; }
      .bar { fill: #3987e5; }
      .bar-spread { fill: #199e70; }
      .threshold { stroke: #d95926; }
      .threshold-label { fill: #d95926; }
      rect.bg { fill: #1a1a19; }
    }
  </style>

  <rect class="bg" width="640" height="380" fill="#fcfcfb" rx="6"/>

  <text x="40" y="28" class="title">Two detector personalities</text>
  <text x="40" y="46" class="subtitle">Output probability distributions — bimodal (top) vs spread (bottom)</text>

  <!-- Bimodal example: mid_timing_attack_vs_terran -->
  <!-- Histogram: [58432, 3099, 761, 0, 0, 0, 0, 0, 0, 14608] (approx from data) -->
  <text x="40" y="76" class="label" font-weight="600">mid_timing_attack_vs_terran — bimodal</text>

  <!-- Y axis -->
  <line x1="80" y1="90" x2="80" y2="170" stroke="#52514e" stroke-width="1"/>
  <!-- X axis -->
  <line x1="80" y1="170" x2="600" y2="170" stroke="#52514e" stroke-width="1"/>

  <!-- Bars: 10 bins, each 52px wide -->
  <rect x="80"  y="90"  width="50" height="80" rx="2" class="bar"/>
  <rect x="132" y="158" width="50" height="12" rx="2" class="bar"/>
  <rect x="184" y="163" width="50" height="7"  rx="2" class="bar"/>
  <rect x="236" y="170" width="50" height="0"  rx="2" class="bar"/>
  <rect x="288" y="170" width="50" height="0"  rx="2" class="bar"/>
  <rect x="340" y="170" width="50" height="0"  rx="2" class="bar"/>
  <rect x="392" y="170" width="50" height="0"  rx="2" class="bar"/>
  <rect x="444" y="170" width="50" height="0"  rx="2" class="bar"/>
  <rect x="496" y="170" width="50" height="0"  rx="2" class="bar"/>
  <rect x="548" y="110" width="50" height="60" rx="2" class="bar"/>

  <!-- Threshold lines -->
  <line x1="236" y1="85" x2="236" y2="175" class="threshold"/>
  <text x="238" y="84" class="threshold-label">0.3</text>
  <line x1="444" y1="85" x2="444" y2="175" class="threshold"/>
  <text x="446" y="84" class="threshold-label">0.7</text>

  <!-- Bucket labels -->
  <text x="158" y="184" class="axis-label" text-anchor="middle">LOW 77%</text>
  <text x="340" y="184" class="axis-label" text-anchor="middle">MEDIUM 4%</text>
  <text x="522" y="184" class="axis-label" text-anchor="middle">HIGH 19%</text>

  <!-- X axis labels -->
  <text x="80"  y="196" class="axis-label">0.0</text>
  <text x="336" y="196" class="axis-label">0.5</text>
  <text x="588" y="196" class="axis-label">1.0</text>

  <!-- Spread example: early_cheese_vs_protoss -->
  <text x="40" y="230" class="label" font-weight="600">early_cheese_vs_protoss — spread</text>

  <!-- Y axis -->
  <line x1="80" y1="244" x2="80" y2="324" stroke="#52514e" stroke-width="1"/>
  <!-- X axis -->
  <line x1="80" y1="324" x2="600" y2="324" stroke="#52514e" stroke-width="1"/>

  <!-- Bars: histogram roughly [31200, 5400, 3200, 3200, 3200, 5000, 3200, 800, 600, 5400] -->
  <rect x="80"  y="244" width="50" height="80" rx="2" class="bar-spread"/>
  <rect x="132" y="296" width="50" height="28" rx="2" class="bar-spread"/>
  <rect x="184" y="306" width="50" height="18" rx="2" class="bar-spread"/>
  <rect x="236" y="306" width="50" height="18" rx="2" class="bar-spread"/>
  <rect x="288" y="306" width="50" height="18" rx="2" class="bar-spread"/>
  <rect x="340" y="300" width="50" height="24" rx="2" class="bar-spread"/>
  <rect x="392" y="306" width="50" height="18" rx="2" class="bar-spread"/>
  <rect x="444" y="316" width="50" height="8"  rx="2" class="bar-spread"/>
  <rect x="496" y="318" width="50" height="6"  rx="2" class="bar-spread"/>
  <rect x="548" y="296" width="50" height="28" rx="2" class="bar-spread"/>

  <!-- Threshold lines -->
  <line x1="236" y1="239" x2="236" y2="329" class="threshold"/>
  <text x="238" y="238" class="threshold-label">0.3</text>
  <line x1="444" y1="239" x2="444" y2="329" class="threshold"/>
  <text x="446" y="238" class="threshold-label">0.7</text>

  <!-- Bucket labels -->
  <text x="158" y="338" class="axis-label" text-anchor="middle">LOW 58%</text>
  <text x="340" y="338" class="axis-label" text-anchor="middle">MEDIUM 30%</text>
  <text x="522" y="338" class="axis-label" text-anchor="middle">HIGH 12%</text>

  <!-- X axis labels -->
  <text x="80"  y="350" class="axis-label">0.0</text>
  <text x="336" y="350" class="axis-label">0.5</text>
  <text x="588" y="350" class="axis-label">1.0</text>

  <!-- Legend -->
  <rect x="40" y="362" width="10" height="10" rx="2" class="bar"/>
  <text x="54" y="371" class="label">Bimodal — MEDIUM bucket empty, binary discretization appropriate</text>
  <rect x="380" y="362" width="10" height="10" rx="2" class="bar-spread"/>
  <text x="394" y="371" class="label">Spread — MEDIUM meaningful, 3-bucket adds signal</text>
</svg>
