[project]
name = "quarkmind-classifier"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.0.0",
    "onnx>=1.15.0",
    "onnxruntime>=1.17.0",
    "onnxscript>=0.1.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "scikit-learn>=1.4.0",
    "sc2reader>=0.9.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
llm = ["anthropic>=0.30.0"]
spawningtool = ["spawningtool>=3.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
