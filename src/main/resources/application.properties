quarkus.application.name=quarkmind-agent

# Force Quarkus to scan casehub jars without Jandex index for CDI beans
quarkus.index-dependency.casehub-persistence-memory.group-id=io.casehub
quarkus.index-dependency.casehub-persistence-memory.artifact-id=casehub-persistence-memory
quarkus.index-dependency.casehub-ledger-memory.group-id=io.casehub
quarkus.index-dependency.casehub-ledger-memory.artifact-id=casehub-ledger-memory
quarkus.index-dependency.engine-scheduler-quartz.group-id=io.casehub
quarkus.index-dependency.engine-scheduler-quartz.artifact-id=casehub-engine-scheduler-quartz
quarkus.index-dependency.neocortex-memory-cbr-inmem.group-id=io.casehub
quarkus.index-dependency.neocortex-memory-cbr-inmem.artifact-id=casehub-neocortex-memory-cbr-inmem

# Exclude CDI beans from transitive deps that require infrastructure quarkmind doesn't provide:
# - Eidos JPA beans: need a default EntityManager (quarkmind has no unnamed datasource)
# - Eidos reactive health: not needed (quarkmind uses blocking only)
# - Qhorus dashboard: needs reactive qhorus services (quarkmind uses blocking qhorus only)
quarkus.arc.exclude-types=\
  io.casehub.eidos.runtime.health.jpa.JpaAgentStateStore,\
  io.casehub.eidos.runtime.registry.jpa.JpaAgentRegistry,\
  io.casehub.eidos.runtime.health.jpa.JpaCapabilitySpecializationStore,\
  io.casehub.eidos.runtime.health.jpa.JpaBehavioralSignalStore,\
  io.casehub.eidos.runtime.health.jpa.JpaDispositionSignalStore,\
  io.casehub.eidos.runtime.health.DefaultReactiveCapabilityHealth,\
  io.casehub.engine.internal.worker.NoOpCapabilityHealth,\
  io.casehub.qhorus.runtime.dashboard.QhorusDashboardService

# Game loop tick interval (mock mode)
starcraft.tick.interval=500ms

# SC2 connection (used in %sc2 profile only)
%sc2.starcraft.sc2.host=127.0.0.1
%sc2.starcraft.sc2.port=8168

# SC2 game settings (used in %sc2 profile)
%sc2.starcraft.sc2.map=TorchesAIE_v4
%sc2.starcraft.sc2.difficulty=VERY_EASY
%sc2.starcraft.sc2.opponent-race=RANDOM

# Opponent identity for CBR case enrichment (#220)
%mock.quarkmind.opponent.id=mock-opponent
%emulated.quarkmind.opponent.id=PROTOSS_4GATE
%emulated-sc2.quarkmind.opponent.id=PROTOSS_4GATE
%test.quarkmind.opponent.id=mock-opponent

# casehub-engine-scheduler-quartz brings quarkus-quartz. Force the Quartz scheduler to
# start even when no @Scheduled methods are found — QuartzWorkerExecutionManager needs it.
# Quartz requires 6-field cron (with seconds); standard quarkus-scheduler uses 5-field Unix cron.
quarkus.scheduler.start-mode=forced
quarkus.quartz.store-type=ram
# Prevent auto-ticking during @QuarkusTest — scheduler infrastructure starts (required by
# QuartzWorkerExecutionManager) but jobs don't fire until Scheduler.resume() is called.
# Cannot use quarkus.scheduler.enabled=false in test — that prevents the Quartz scheduler
# from starting entirely, breaking engine beans that depend on the Scheduler CDI bean.
%test.quarkus.scheduler.start-mode=halted
# Use a random available port for @QuarkusTest — prevents "port already bound" failures
# when a previous test run didn't release 8081, or multiple test suites run in parallel
%test.quarkus.http.test-port=0

# Replay profile — drives the agent loop from a real .SC2Replay file (observe-only)
# Run with: mvn quarkus:dev -Dquarkus.profile=replay
%replay.starcraft.replay.file=replays/aiarena_protoss/Nothing_4720936.SC2Replay
%replay.starcraft.replay.player=1

# SmallRye in-memory channel — economics tick events (FlowEconomicsTask → EconomicsFlow)
# No explicit connector needed — SmallRye auto-discovers producer-consumer pairs on memory channels

# Global log file rotation guard — applies to any profile that enables file logging.
# Caps any single log file at 4G; 0 backups means the rotated file overwrites rather than
# accumulating. Prevents invisible disk exhaustion when logs are left running unattended.
quarkus.log.file.rotation.max-file-size=4G
quarkus.log.file.rotation.max-backup-index=0

# Graceful shutdown — gives in-flight requests, async channels, and file handles time to close.
# Default is already 10S but making it explicit. Prevents the "deleted-open-file" disk space
# leak: on Ctrl+C, the JVM closes all log file handles before exiting.
quarkus.shutdown.timeout=10S

# Emulated SC2 profile — physics simulation, no real SC2 binary needed
# Run with: mvn quarkus:dev -Dquarkus.profile=emulated
# Phase E1: probe-driven mineral harvesting

# File logging for emulated mode — debug output to /tmp for grepping without terminal copy-paste.
# Rotation prevents unbounded growth (161GB invisible disk usage was observed in a similar setup
# when the log was deleted while Java held it open — disk freed only when JVM exited).
#
# IMPORTANT: if you need to delete /tmp/quarkmind-emulated.log, kill Java first:
#   pkill -f 'quarkus:dev' && sleep 2 && rm /tmp/quarkmind-emulated.log
# Deleting the file while Java has it open leaves an invisible open-file descriptor;
# lsof -c java | grep deleted will show it; disk space is only freed when the JVM exits.
# Scouting: emulated map is 64x64 tiles; real SC2 maps are 256x256.
# estimatedEnemyBase() uses mapWidth to compute far-corner coordinates within bounds.
%emulated.scouting.map.width=64

%emulated.emulated.active=true
%emulated.quarkus.log.file.enable=true
%emulated.quarkus.log.file.path=/tmp/quarkmind-emulated.log
%emulated.quarkus.log.file.level=DEBUG
%emulated.quarkus.log.file.rotation.max-file-size=20M
%emulated.quarkus.log.file.rotation.max-backup-index=3
%emulated.quarkus.log.file.rotation.rotate-on-boot=true

# Tactics strategy selection
quarkmind.tactics.kite.strategy=direct
quarkmind.tactics.focus-fire.strategy=lowest-hp
%emulated.quarkmind.tactics.kite.strategy=terrain-aware

# --- casehub-ledger (Layer 4) ---
# DefaultOutcomeRecorder throws ISE if this is absent and OutcomeRecord.attestorId is null
casehub.ledger.outcome.default-attestor-id=quarkmind:game-engine@v1
quarkus.arc.selected-alternatives=\
  io.casehub.ledger.memory.InMemoryLedgerEntryRepository,\
  io.casehub.ledger.memory.InMemoryLedgerMerkleFrontierRepository,\
  io.casehub.ledger.memory.InMemoryActorTrustScoreRepository,\
  io.casehub.ledger.memory.InMemoryKeyRotationRepository,\
  io.casehub.ledger.memory.InMemoryAgentSigner,\
  io.casehub.ledger.memory.InMemoryActorIdentityBindingRepository,\
  io.casehub.ledger.memory.InMemoryReactiveLedgerEntryRepository,\
  io.casehub.ledger.memory.InMemoryReactiveKeyRotationRepository,\
  io.casehub.persistence.memory.InMemoryCaseInstanceRepository,\
  io.casehub.persistence.memory.InMemoryEventLogRepository,\
  io.casehub.persistence.memory.InMemoryCaseMetaModelRepository,\
  io.casehub.persistence.memory.InMemorySubCaseGroupRepository,\
  io.casehub.persistence.memory.InMemoryPlanItemStore,\
  io.casehub.eidos.memory.InMemoryAgentRegistry,\
  io.casehub.eidos.memory.InMemoryAgentStateStore,\
  io.casehub.eidos.memory.InMemoryCapabilitySpecializationStore,\
  io.casehub.eidos.memory.InMemoryRenderedPromptCache,\
  io.casehub.persistence.memory.InMemoryReactiveEventLogRepository,\
  io.casehub.persistence.memory.InMemoryReactiveCaseInstanceRepository,\
  io.casehub.persistence.memory.InMemoryReactiveSubCaseGroupRepository,\
  io.casehub.persistence.memory.InMemoryReactiveCaseMetaModelRepository,\
  io.quarkmind.agent.QuarkMindTrustRoutingPolicyProvider
casehub.ledger.hash-chain.enabled=false

# --- casehub-qhorus (Layer 3) ---
# qhorus ships quarkus.hibernate-orm.qhorus.* and quarkus.flyway.qhorus.* in its own
# application.properties; quarkmind only needs to provide the datasource URL.
# H2 in-memory for all non-sc2 profiles; %sc2 requires a real Postgres URL.
quarkus.datasource."qhorus".db-kind=h2
quarkus.datasource."qhorus".jdbc.url=jdbc:h2:mem:qhorus;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
# Disable reactive pool — quarkmind uses blocking qhorus only. Without this,
# FastBootHibernateReactivePersistenceProvider tries to register a reactive pool
# for the qhorus PU and fails at boot (no reactive datasource configured).
quarkus.datasource.reactive=false
quarkus.datasource."qhorus".reactive=false

# %sc2 profile: file logging so background runs are observable without stdout redirect
%sc2.quarkus.log.file.enable=true
%sc2.quarkus.log.file.path=/tmp/quarkmind-sc2.log
%sc2.quarkus.log.file.level=INFO
%sc2.quarkus.log.file.rotation.max-file-size=20M
%sc2.quarkus.log.file.rotation.max-backup-index=3
%sc2.quarkus.log.file.rotation.rotate-on-boot=true

# --- casehub-ledger trust-score accumulation (Layer 6) ---
# Required for IncrementalTrustUpdateObserver to materialize trust scores after each game.
# Without these, MaterializedTrustScoreSource returns empty and routing stays in BOOTSTRAP permanently.
# %sc2 profile omitted — TrustScoreJob runs nightly there against a real DB.
casehub.ledger.trust-score.enabled=true
casehub.ledger.trust-score.incremental.enabled=true
casehub.ledger.trust-score.materialization.enabled=true

# --- L6: trust routing policy for strategy selection ---
quarkmind.trust.strategy.min-observations=10
quarkmind.trust.strategy.threshold=0.65
quarkmind.trust.strategy.borderline-margin=0.08
quarkmind.trust.strategy.blend-factor=0.6

# --- Advisory trust routing — quality floors ---
# Crisis advisors converge faster (min-observations=5);
# strategic and economic advisors use min-observations=10
quarkmind.advisory.trust.crisis.min-observations=5
quarkmind.advisory.trust.strategic.min-observations=10
quarkmind.advisory.trust.economic.min-observations=10
quarkmind.advisory.trust.quality-floors.response-latency=0.3
quarkmind.advisory.trust.quality-floors.recommendation-quality=0.2
quarkmind.advisory.trust.quality-floors.game-outcome=0.2

# --- Commentary configuration ---
# Reactive commentary cooldown (5 seconds at 22.4fps)
quarkmind.commentary.reactive.cooldown-frames=110
# Narrative commentary window (45 seconds or 4 moments)
quarkmind.commentary.narrative.window-frames=1000
quarkmind.commentary.narrative.window-count=4
quarkmind.commentary.narrative.min-emit-frames=672
# Commentary trust routing
quarkmind.commentary.trust.min-observations=5

# --- Milestone-based trust scoring (Layer 6+) ---
# Milestones record intermediate trust attestations at game-time checkpoints.
# Requires engine#648 (AttestingOutcomeRecorder SPI) for milestone attestations;
# game-end recording works regardless.
quarkmind.milestones.enabled=true
quarkmind.milestones.dead-zone-threshold=0.15
quarkmind.milestones.dominance.max-expected-economy-delta=25.0
quarkmind.milestones.dominance.max-expected-army-delta=3000
quarkmind.milestones.dominance.max-expected-tech-delta=2.0
quarkmind.milestones.dominance.max-expected-base-delta=3
quarkmind.milestones.dominance.min-enemy-visibility=3
quarkmind.milestones.dominance.weight-strategy=drools
quarkmind.milestones.dominance.anchors[0].frame=0
quarkmind.milestones.dominance.anchors[0].economy-weight=0.30
quarkmind.milestones.dominance.anchors[0].army-weight=0.35
quarkmind.milestones.dominance.anchors[0].tech-weight=0.20
quarkmind.milestones.dominance.anchors[0].bases-weight=0.15

# Frame-based triggers (SC2 Faster = 22.4 fps)
quarkmind.milestones.frame-thresholds[0].frame=4032
quarkmind.milestones.frame-thresholds[0].weight=0.3
quarkmind.milestones.frame-thresholds[1].frame=10752
quarkmind.milestones.frame-thresholds[1].weight=0.5

# Phase-based triggers
quarkmind.milestones.phase-triggers.expected-game-length=20160
quarkmind.milestones.phase-triggers.min-weight=0.1
quarkmind.milestones.phase-triggers.max-weight=0.8

# Profile overrides — milestones disabled in profiles without meaningful game-end outcomes
%mock.quarkmind.milestones.enabled=false
%emulated.quarkmind.milestones.enabled=false
%emulated-sc2.quarkmind.milestones.enabled=false
%replay.quarkmind.milestones.enabled=false

# --- %emulated-sc2 profile: SC2 protocol over EmulatedGame physics ---
# Run with: mvn quarkus:dev -Dquarkus.profile=emulated-sc2
%emulated-sc2.starcraft.sc2.skip-launch=true
%emulated-sc2.starcraft.sc2.port=8168
%emulated-sc2.starcraft.sc2.connect.retry=5
%emulated-sc2.starcraft.sc2.connect.retry-interval-ms=200
%emulated-sc2.emulated.active=true
%emulated-sc2.scouting.map.width=64
%emulated-sc2.quarkmind.tactics.kite.strategy=terrain-aware

# Game mode (ai = agent plays, coach = human plays with LLM advice)
quarkmind.game.mode=ai
quarkmind.coaching.compliance.auto-expire-frames=900
quarkmind.coaching.default-personality=directive
