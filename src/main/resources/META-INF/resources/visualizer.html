<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>QuarkMind Visualizer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0a1a; overflow: hidden; font-family: monospace; color: #ccc; }

    #workbench {
      display: grid;
      grid-template-rows: 36px 1fr 24px;
      grid-template-columns: 1fr 300px;
      grid-template-areas:
        "toolbar toolbar"
        "canvas  panel"
        "status  status";
      width: 100vw; height: 100vh;
    }
    #wb-toolbar {
      grid-area: toolbar; display: flex; align-items: center; justify-content: space-between;
      background: rgba(10,10,30,0.95); border-bottom: 1px solid #2a2a5e; padding: 0 12px;
    }
    #wb-tabs { display: flex; gap: 0; }
    .wb-tab {
      background: none; border: none; color: #aaaacc; font-family: monospace; font-size: 12px;
      padding: 8px 14px; cursor: pointer; border-bottom: 2px solid transparent;
    }
    .wb-tab.active { color: #88bbff; border-bottom-color: #88bbff; }
    .wb-tab:hover { color: #88bbff; }
    #wb-hud { font-size: 12px; color: #88bbff; }

    #wb-canvas {
      grid-area: canvas; position: relative; overflow: hidden; background: #0a0a1a;
    }
    #wb-panel {
      grid-area: panel; display: flex; flex-direction: column;
      background: rgba(10,10,30,0.85); border-left: 1px solid #2a2a5e;
    }
    #wb-pages { flex: 1; overflow-y: auto; padding: 10px; font-size: 12px; }
    .wb-page { display: none; }
    .wb-page.active { display: block; }

    #wb-detail {
      height: 160px; border-top: 1px solid #2a2a5e; padding: 10px; font-size: 12px;
      color: #888;
    }
    #wb-status {
      grid-area: status; display: flex; gap: 20px; align-items: center;
      background: rgba(10,10,30,0.95); border-top: 1px solid #2a2a5e;
      padding: 0 12px; font-size: 11px; color: #888;
    }

    /* 3D view controls — positioned inside #wb-canvas */
    #angle-btns {
      position: absolute; top: 12px; left: 12px;
      display: flex; flex-direction: column; gap: 6px; z-index: 10;
    }
    .angle-btn {
      background: rgba(10,10,30,0.85); border: 1px solid #2a2a5e;
      border-radius: 5px; color: #aaaacc; font-family: monospace;
      font-size: 11px; padding: 6px 12px; cursor: pointer;
    }
    .angle-btn.active, .angle-btn:hover { border-color: #88bbff; color: #88bbff; }
    #mode-toggle { position: absolute; top: 12px; right: 12px; display: flex; z-index: 10; }
    .mode-btn {
      background: rgba(10,10,30,0.85); border: 1px solid #2a2a5e;
      color: #aaaacc; font-family: monospace; font-size: 11px; padding: 6px 12px; cursor: pointer;
    }
    .mode-btn:first-child { border-radius: 5px 0 0 5px; }
    .mode-btn:last-child  { border-radius: 0 5px 5px 0; }
    .mode-btn.active { background: rgba(40,80,160,0.5); border-color: #88bbff; color: #88bbff; }

    #config-panel {
      display: none; position: absolute; top: 44px; right: 12px;
      background: rgba(10,10,30,0.9); border: 1px solid #2a2a5e;
      border-radius: 8px; padding: 14px; font-size: 12px; min-width: 200px; z-index: 10;
    }
    #config-panel label { color: #aaaacc; display: block; margin: 6px 0 2px; }
    #config-panel input, #config-panel select {
      width: 100%; background: #111; border: 1px solid #334; color: #ccc;
      padding: 4px; border-radius: 3px;
    }
    .cfg-btn {
      margin-top: 8px; width: 100%; padding: 6px;
      background: #223; border: 1px solid #445; color: #aac;
      border-radius: 4px; cursor: pointer; font-family: monospace;
    }
    .cfg-btn:hover { border-color: #88bbff; color: #88bbff; }
    #cfg-status { margin-top: 6px; font-size: 11px; min-height: 14px; }

    .minerals-critical { color: #ff4444; }
    .minerals-low      { color: #ffaa00; }

    /* Workbench page styles */
    .assessment-item { margin-bottom: 8px; }
    .assessment-header { cursor: pointer; font-weight: bold; padding: 4px 0; }
    .confidence-bar { background: #1a1a3e; height: 4px; border-radius: 2px; margin: 2px 0 6px; }
    .assessment-body { padding: 4px 0 8px; }
    .rationale { font-size: 11px; color: #999; margin-bottom: 6px; }
    .counter-section { margin: 4px 0; }
    .counter-section ul { margin: 2px 0 0 16px; list-style: none; }
    .counter-unit { cursor: pointer; text-decoration: underline; }
    .counter-unit:hover { color: #88bbff; }
    .coaching-item { border-bottom: 1px solid #1a1a3e; padding: 6px 0; }
    .coaching-header { font-size: 11px; color: #88bbff; }
    .coaching-advice { margin: 4px 0; }
    .coaching-status { font-size: 11px; color: #999; }
    .strategy-section { padding: 4px 0; }
    .strategy-label { font-weight: bold; color: #88bbff; margin-bottom: 4px; }
    .strategy-value { font-size: 16px; margin-bottom: 8px; }
    .strategy-row { font-size: 12px; margin: 2px 0; }
    .strategy-row span { color: #999; }
  </style>
</head>
<body>
<div id="workbench">
  <div id="wb-toolbar">
    <div id="wb-tabs">
      <button class="wb-tab active" data-page="pattern">Pattern</button>
      <button class="wb-tab" data-page="coaching">Coaching</button>
      <button class="wb-tab" data-page="strategy">Strategy</button>
    </div>
    <div id="wb-hud">Connecting...</div>
  </div>
  <div id="wb-canvas">
    <div id="angle-btns">
      <button class="angle-btn" onclick="setAngle('top',this)">Top-down</button>
      <button class="angle-btn active" id="angIso" onclick="setAngle('iso',this)">Isometric</button>
      <button class="angle-btn" onclick="setAngle('low',this)">Low angle</button>
    </div>
    <div id="mode-toggle">
      <button class="mode-btn active" id="btn2d" onclick="setMode('2d')">2D Sprites</button>
      <button class="mode-btn" id="btn3d" onclick="setMode('3d')">3D Models</button>
    </div>
    <div id="config-panel">
      <label>Wave spawn frame</label><input id="cfg-wave-frame" type="number" value="300">
      <label>Wave unit count</label><input id="cfg-unit-count" type="number" value="5">
      <label>Unit type</label>
      <select id="cfg-unit-type">
        <option value="ZERGLING">ZERGLING</option>
        <option value="MARINE">MARINE</option>
        <option value="MARAUDER">MARAUDER</option>
        <option value="MEDIVAC">MEDIVAC</option>
      </select>
      <label>Speed: <span id="cfg-speed-val">1.0</span></label>
      <input id="cfg-speed" type="range" min="0.2" max="3.0" step="0.1" value="1.0">
      <button class="cfg-btn" id="cfg-apply">Apply (next restart)</button>
      <button class="cfg-btn" id="cfg-restart">Apply + Restart</button>
      <div id="cfg-status"></div>
    </div>
  </div>
  <div id="wb-panel">
    <div id="wb-pages">
      <div id="page-pattern" class="wb-page active">No pattern data</div>
      <div id="page-coaching" class="wb-page">No coaching advice yet</div>
      <div id="page-strategy" class="wb-page">No strategy data</div>
    </div>
    <div id="wb-detail">Click a unit or counter to inspect</div>
  </div>
  <div id="wb-status">
    <span id="status-frame">Frame: 0</span>
    <span id="status-phase">Phase: —</span>
    <span id="status-game" style="color:#888">Game: —</span>
    <span id="status-intel" style="color:#888">Intel: —</span>
  </div>
</div>
<script src="/sprites/three.min.js"></script>
<script src="/visualizer.js"></script>
</body>
</html>
