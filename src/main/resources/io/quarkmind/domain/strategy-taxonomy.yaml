archetypes:
  TERRAN_MARINE_RUSH:
    displayName: "Marine Rush"
    race: TERRAN
    phase: EARLY
    category: RUSH
    phaseWindow: [0.0, 5.0]
    handAuthored: true
    signature:
      units:
        - type: MARINE
          minCount: 5
      noExpansion: true
    strongCounters:
      - units: [STALKER, SENTRY]
        action: "Wall off natural with Stalkers and a Sentry for Force Field"
    weakCounters:
      - units: [ZEALOT]
        action: "Zealots alone trade poorly against kiting Marines"
    detectionSignals:
      - "5+ Marines before 4 minutes"
      - "No expansion with Marines"

