<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="minGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="gasGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="720" height="400" fill="#fafafa" rx="6"/>

  <!-- Title -->
  <text x="360" y="32" text-anchor="middle" font-size="15" font-weight="600" fill="#1e293b">SC2 Rate Algorithm Fit: Simple Window vs EMA</text>
  <text x="360" y="50" text-anchor="middle" font-size="11" fill="#64748b">MAPE (%) across 2637 rate intervals, 30 oracle replays</text>

  <!-- Chart area: x=80..680, y=70..340 -->
  <!-- Y axis: 0% to 60%, gridlines at 10% intervals -->
  <line x1="80" y1="70" x2="80" y2="340" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="80" y1="340" x2="680" y2="340" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Y gridlines and labels -->
  <line x1="80" y1="340" x2="680" y2="340" stroke="#e2e8f0" stroke-width="0.5"/>
  <text x="72" y="344" text-anchor="end" font-size="10" fill="#94a3b8">0%</text>

  <line x1="80" y1="295" x2="680" y2="295" stroke="#e2e8f0" stroke-width="0.5"/>
  <text x="72" y="299" text-anchor="end" font-size="10" fill="#94a3b8">10%</text>

  <line x1="80" y1="250" x2="680" y2="250" stroke="#e2e8f0" stroke-width="0.5"/>
  <text x="72" y="254" text-anchor="end" font-size="10" fill="#94a3b8">20%</text>

  <line x1="80" y1="205" x2="680" y2="205" stroke="#e2e8f0" stroke-width="0.5"/>
  <text x="72" y="209" text-anchor="end" font-size="10" fill="#94a3b8">30%</text>

  <line x1="80" y1="160" x2="680" y2="160" stroke="#e2e8f0" stroke-width="0.5"/>
  <text x="72" y="164" text-anchor="end" font-size="10" fill="#94a3b8">40%</text>

  <line x1="80" y1="115" x2="680" y2="115" stroke="#e2e8f0" stroke-width="0.5"/>
  <text x="72" y="119" text-anchor="end" font-size="10" fill="#94a3b8">50%</text>

  <line x1="80" y1="70" x2="680" y2="70" stroke="#e2e8f0" stroke-width="0.5"/>
  <text x="72" y="74" text-anchor="end" font-size="10" fill="#94a3b8">60%</text>

  <!-- X axis labels: alpha values -->
  <!-- x positions: 0.05=135, 0.10=190, 0.15=244, 0.20=299, 0.25=353, 0.30=408, 0.40=462, 0.50=517, 0.60=571, 0.80=626, 1.00=680 -->
  <!-- Actually let me space them evenly: 11 points from x=110 to x=660 -->

  <!-- Mineral data: alpha -> MAPE -->
  <!-- 0.05:34.6, 0.10:22.9, 0.15:18.2, 0.20:16.3, 0.25:15.8, 0.30:16.1, 0.40:18.0, 0.50:20.6, 0.60:23.7, 0.80:30.7, 1.00:39.2 -->
  <!-- Y = 340 - (MAPE/60)*270 -->
  <!-- 34.6->184.3, 22.9->237.0, 18.2->258.2, 16.3->266.7, 15.8->268.9, 16.1->267.6, 18.0->259.0, 20.6->247.3, 23.7->233.4, 30.7->202.0, 39.2->163.7 -->

  <!-- Gas data: alpha -> MAPE -->
  <!-- 0.05:54.9, 0.10:39.6, 0.15:32.8, 0.20:29.4, 0.25:27.6, 0.30:26.7, 0.40:26.4, 0.50:27.1, 0.60:28.1, 0.80:31.4, 1.00:36.1 -->
  <!-- 54.9->92.8, 39.6->161.9, 32.8->192.5, 29.4->207.8, 27.6->215.9, 26.7->220.0, 26.4->221.3, 27.1->218.2, 28.1->213.7, 31.4->198.9, 36.1->177.6 -->

  <!-- X positions for 11 alpha values, evenly spaced -->
  <!-- 110, 165, 220, 275, 330, 385, 440, 495, 550, 605, 660 -->

  <!-- Mineral area fill -->
  <path d="M110,184 L165,237 L220,258 L275,267 L330,269 L385,268 L440,259 L495,247 L550,233 L605,202 L660,164 L660,340 L110,340 Z" fill="url(#minGrad)"/>

  <!-- Gas area fill -->
  <path d="M110,93 L165,162 L220,193 L275,208 L330,216 L385,220 L440,221 L495,218 L550,214 L605,199 L660,178 L660,340 L110,340 Z" fill="url(#gasGrad)"/>

  <!-- Mineral line -->
  <polyline points="110,184 165,237 220,258 275,267 330,269 385,268 440,259 495,247 550,233 605,202 660,164" fill="none" stroke="#3b82f6" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Gas line -->
  <polyline points="110,93 165,162 220,193 275,208 330,216 385,220 440,221 495,218 550,214 605,199 660,178" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Mineral dots -->
  <circle cx="110" cy="184" r="4" fill="#3b82f6"/>
  <circle cx="165" cy="237" r="4" fill="#3b82f6"/>
  <circle cx="220" cy="258" r="4" fill="#3b82f6"/>
  <circle cx="275" cy="267" r="4" fill="#3b82f6"/>
  <circle cx="330" cy="269" r="5" fill="#3b82f6" stroke="#fff" stroke-width="2"/>
  <circle cx="385" cy="268" r="4" fill="#3b82f6"/>
  <circle cx="440" cy="259" r="4" fill="#3b82f6"/>
  <circle cx="495" cy="247" r="4" fill="#3b82f6"/>
  <circle cx="550" cy="233" r="4" fill="#3b82f6"/>
  <circle cx="605" cy="202" r="4" fill="#3b82f6"/>
  <circle cx="660" cy="164" r="4" fill="#3b82f6"/>

  <!-- Gas dots -->
  <circle cx="110" cy="93" r="4" fill="#f59e0b"/>
  <circle cx="165" cy="162" r="4" fill="#f59e0b"/>
  <circle cx="220" cy="193" r="4" fill="#f59e0b"/>
  <circle cx="275" cy="208" r="4" fill="#f59e0b"/>
  <circle cx="330" cy="216" r="4" fill="#f59e0b"/>
  <circle cx="385" cy="220" r="4" fill="#f59e0b"/>
  <circle cx="440" cy="221" r="5" fill="#f59e0b" stroke="#fff" stroke-width="2"/>
  <circle cx="495" cy="218" r="4" fill="#f59e0b"/>
  <circle cx="550" cy="214" r="4" fill="#f59e0b"/>
  <circle cx="605" cy="199" r="4" fill="#f59e0b"/>
  <circle cx="660" cy="178" r="4" fill="#f59e0b"/>

  <!-- Best-fit annotations -->
  <text x="330" y="288" text-anchor="middle" font-size="10" font-weight="600" fill="#3b82f6">15.8%</text>
  <text x="440" y="240" text-anchor="middle" font-size="10" font-weight="600" fill="#f59e0b">26.4%</text>

  <!-- Simple window annotation -->
  <text x="660" y="155" text-anchor="middle" font-size="10" fill="#94a3b8">simple</text>
  <text x="660" y="166" text-anchor="middle" font-size="10" fill="#94a3b8">window</text>
  <text x="660" y="180" text-anchor="middle" font-size="9" font-weight="600" fill="#ef4444">39.2%</text>

  <!-- X axis labels -->
  <text x="110" y="358" text-anchor="middle" font-size="9" fill="#64748b">0.05</text>
  <text x="165" y="358" text-anchor="middle" font-size="9" fill="#64748b">0.10</text>
  <text x="220" y="358" text-anchor="middle" font-size="9" fill="#64748b">0.15</text>
  <text x="275" y="358" text-anchor="middle" font-size="9" fill="#64748b">0.20</text>
  <text x="330" y="358" text-anchor="middle" font-size="9" fill="#64748b">0.25</text>
  <text x="385" y="358" text-anchor="middle" font-size="9" fill="#64748b">0.30</text>
  <text x="440" y="358" text-anchor="middle" font-size="9" fill="#64748b">0.40</text>
  <text x="495" y="358" text-anchor="middle" font-size="9" fill="#64748b">0.50</text>
  <text x="550" y="358" text-anchor="middle" font-size="9" fill="#64748b">0.60</text>
  <text x="605" y="358" text-anchor="middle" font-size="9" fill="#64748b">0.80</text>
  <text x="660" y="358" text-anchor="middle" font-size="9" fill="#64748b">1.00</text>
  <text x="385" y="378" text-anchor="middle" font-size="11" fill="#475569">EMA alpha</text>

  <!-- Y axis label -->
  <text x="20" y="205" text-anchor="middle" font-size="11" fill="#475569" transform="rotate(-90 20 205)">MAPE (%)</text>

  <!-- Legend -->
  <rect x="200" y="382" width="14" height="3" rx="1" fill="#3b82f6"/>
  <text x="220" y="388" font-size="10" fill="#475569">Minerals (best: 0.25)</text>
  <rect x="380" y="382" width="14" height="3" rx="1" fill="#f59e0b"/>
  <text x="400" y="388" font-size="10" fill="#475569">Vespene (best: 0.40)</text>
</svg>
