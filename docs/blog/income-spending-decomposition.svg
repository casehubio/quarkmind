<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="Inter, system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="720" height="340" rx="8" fill="#1e1e2e"/>

  <!-- Title -->
  <text x="360" y="30" text-anchor="middle" fill="#cdd6f4" font-size="14" font-weight="600">Balance Error Decomposition — 5-minute checkpoint, 168 replays</text>

  <!-- The equation: Balance = Income - Spending -->
  <rect x="30" y="55" width="130" height="44" rx="6" fill="#313244" stroke="#585b70" stroke-width="1"/>
  <text x="95" y="82" text-anchor="middle" fill="#cdd6f4" font-size="13" font-weight="600">Balance</text>

  <text x="178" y="82" text-anchor="middle" fill="#6b7280" font-size="16">=</text>

  <rect x="198" y="55" width="130" height="44" rx="6" fill="#313244" stroke="#89b4fa" stroke-width="1.5"/>
  <text x="263" y="82" text-anchor="middle" fill="#89b4fa" font-size="13" font-weight="600">Income</text>

  <text x="346" y="82" text-anchor="middle" fill="#6b7280" font-size="16">-</text>

  <rect x="366" y="55" width="130" height="44" rx="6" fill="#313244" stroke="#f9e2af" stroke-width="1.5"/>
  <text x="431" y="82" text-anchor="middle" fill="#f9e2af" font-size="13" font-weight="600">Spending</text>

  <!-- Arrow down from Balance -->
  <line x1="95" y1="99" x2="95" y2="125" stroke="#6b7280" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Balance error -->
  <rect x="20" y="130" width="150" height="36" rx="5" fill="#45475a"/>
  <text x="95" y="153" text-anchor="middle" fill="#a6adc8" font-size="11">Mean error: 291</text>

  <!-- Arrow down from Income -->
  <line x1="263" y1="99" x2="263" y2="125" stroke="#89b4fa" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Income error -->
  <rect x="188" y="130" width="150" height="36" rx="5" fill="#1e3a5f"/>
  <text x="263" y="148" text-anchor="middle" fill="#89b4fa" font-size="12" font-weight="600">Mean error: 396</text>
  <text x="263" y="162" text-anchor="middle" fill="#7f99b3" font-size="10">PRIMARY DRIVER</text>

  <!-- Arrow down from Spending -->
  <line x1="431" y1="99" x2="431" y2="125" stroke="#f9e2af" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Spending error -->
  <rect x="356" y="130" width="150" height="36" rx="5" fill="#3d3520"/>
  <text x="431" y="148" text-anchor="middle" fill="#f9e2af" font-size="12" font-weight="600">Mean error: 209</text>
  <text x="431" y="162" text-anchor="middle" fill="#b3a06b" font-size="10">SECONDARY</text>

  <!-- Ratio callout -->
  <rect x="540" y="55" width="160" height="44" rx="6" fill="#313244" stroke="#a6e3a1" stroke-width="1"/>
  <text x="620" y="75" text-anchor="middle" fill="#a6e3a1" font-size="12" font-weight="600">Income is 1.9x</text>
  <text x="620" y="92" text-anchor="middle" fill="#a6e3a1" font-size="12" font-weight="600">larger than spending</text>

  <!-- Direction section -->
  <text x="360" y="200" text-anchor="middle" fill="#cdd6f4" font-size="13" font-weight="600">Direction: where does each error point?</text>

  <!-- Income direction -->
  <rect x="40" y="215" width="300" height="50" rx="5" fill="#1e3a5f"/>
  <text x="190" y="235" text-anchor="middle" fill="#89b4fa" font-size="11" font-weight="500">Mineral income</text>
  <!-- Over bar -->
  <rect x="55" y="245" width="132" height="12" rx="3" fill="#89b4fa" opacity="0.7"/>
  <text x="121" y="255" text-anchor="middle" fill="#1e1e2e" font-size="9" font-weight="600">91 over</text>
  <!-- Under bar -->
  <rect x="189" y="245" width="110" height="12" rx="3" fill="#585b70"/>
  <text x="244" y="255" text-anchor="middle" fill="#cdd6f4" font-size="9" font-weight="600">76 under</text>
  <text x="315" y="255" text-anchor="middle" fill="#6b7280" font-size="9">balanced</text>

  <!-- Spending direction -->
  <rect x="380" y="215" width="300" height="50" rx="5" fill="#3d3520"/>
  <text x="530" y="235" text-anchor="middle" fill="#f9e2af" font-size="11" font-weight="500">Mineral spending</text>
  <!-- Over bar -->
  <rect x="395" y="245" width="91" height="12" rx="3" fill="#f9e2af" opacity="0.7"/>
  <text x="440" y="255" text-anchor="middle" fill="#1e1e2e" font-size="9" font-weight="600">63 over</text>
  <!-- Under bar -->
  <rect x="488" y="245" width="141" height="12" rx="3" fill="#585b70"/>
  <text x="558" y="255" text-anchor="middle" fill="#cdd6f4" font-size="9" font-weight="600">97 under</text>
  <text x="650" y="255" text-anchor="middle" fill="#6b7280" font-size="9">biased under</text>

  <!-- Insight callout -->
  <rect x="40" y="285" width="640" height="40" rx="6" fill="#313244" stroke="#f38ba8" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="360" y="305" text-anchor="middle" fill="#f38ba8" font-size="12" font-weight="500">Previous hypothesis: "EM has too much money, so spending must be wrong."</text>
  <text x="360" y="320" text-anchor="middle" fill="#a6e3a1" font-size="12" font-weight="500">Actual finding: Income error is the primary driver. Spending is secondary.</text>
</svg>
