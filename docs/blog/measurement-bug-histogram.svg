<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340">
  <style>
    text { font-family: -apple-system, 'Segoe UI', sans-serif; fill: #333; }
    .title { font-size: 13px; font-weight: 600; }
    .label { font-size: 11px; }
    .tick-label { font-size: 10px; fill: #666; }
    .axis { stroke: #999; stroke-width: 1; }
    .bar-buggy { fill: #e74c3c; opacity: 0.85; }
    .bar-correct { fill: #2ecc71; opacity: 0.85; }
    .stat { font-size: 11px; fill: #555; }
    .stat-val { font-weight: 600; }
    .panel-bg { fill: #fafafa; stroke: #ddd; stroke-width: 1; rx: 4; }
  </style>

  <!-- Left panel: Index-based (buggy) -->
  <rect class="panel-bg" x="10" y="10" width="380" height="320"/>
  <text class="title" x="200" y="32" text-anchor="middle">Index-based tracking (buggy)</text>

  <!-- Left axes -->
  <line class="axis" x1="60" y1="260" x2="370" y2="260"/>
  <line class="axis" x1="60" y1="50" x2="60" y2="260"/>
  <text class="label" x="215" y="290" text-anchor="middle">Cycle length (ticks)</text>
  <text class="label" x="20" y="155" text-anchor="middle" transform="rotate(-90,20,155)">Frequency %</text>

  <!-- Left bars (buggy distribution from 5-run aggregate) -->
  <!-- Scale: max 22.9% → 200px height. Factor: 200/23 = 8.7 px/% -->
  <!-- Ticks 2-12, spacing 28px, starting at x=75 -->
  <rect class="bar-buggy" x="75" y="61" width="22" height="199" rx="2"/><!-- 2: 22.9% -->
  <rect class="bar-buggy" x="103" y="86" width="22" height="174" rx="2"/><!-- 3: 20.0% -->
  <rect class="bar-buggy" x="131" y="114" width="22" height="146" rx="2"/><!-- 4: 16.8% -->
  <rect class="bar-buggy" x="159" y="125" width="22" height="135" rx="2"/><!-- 5: 15.5% -->
  <rect class="bar-buggy" x="187" y="177" width="22" height="83" rx="2"/><!-- 6: 9.5% -->
  <rect class="bar-buggy" x="215" y="214" width="22" height="46" rx="2"/><!-- 7: 5.3% -->
  <rect class="bar-buggy" x="243" y="225" width="22" height="35" rx="2"/><!-- 8: 4.0% -->
  <rect class="bar-buggy" x="271" y="241" width="22" height="19" rx="2"/><!-- 9: 2.2% -->
  <rect class="bar-buggy" x="299" y="247" width="22" height="13" rx="2"/><!-- 10: 1.5% -->
  <rect class="bar-buggy" x="327" y="251" width="22" height="9" rx="2"/><!-- 11: 1.0% -->
  <rect class="bar-buggy" x="355" y="253" width="22" height="7" rx="2"/><!-- 12+: 0.8% -->

  <!-- Left tick labels -->
  <text class="tick-label" x="86" y="275" text-anchor="middle">2</text>
  <text class="tick-label" x="114" y="275" text-anchor="middle">3</text>
  <text class="tick-label" x="142" y="275" text-anchor="middle">4</text>
  <text class="tick-label" x="170" y="275" text-anchor="middle">5</text>
  <text class="tick-label" x="198" y="275" text-anchor="middle">6</text>
  <text class="tick-label" x="226" y="275" text-anchor="middle">7</text>
  <text class="tick-label" x="254" y="275" text-anchor="middle">8</text>
  <text class="tick-label" x="282" y="275" text-anchor="middle">9</text>
  <text class="tick-label" x="310" y="275" text-anchor="middle">10</text>
  <text class="tick-label" x="338" y="275" text-anchor="middle">11</text>
  <text class="tick-label" x="366" y="275" text-anchor="middle">12</text>

  <!-- Left stats -->
  <text class="stat" x="280" y="55"><tspan class="stat-val">σ = 2.54</tspan>  mean = 4.47</text>
  <text class="stat" x="280" y="70">range 2–23</text>

  <!-- Right panel: Tag-based (correct) -->
  <rect class="panel-bg" x="410" y="10" width="380" height="320"/>
  <text class="title" x="600" y="32" text-anchor="middle">Tag-based tracking (correct)</text>

  <!-- Right axes -->
  <line class="axis" x1="460" y1="260" x2="770" y2="260"/>
  <line class="axis" x1="460" y1="50" x2="460" y2="260"/>
  <text class="label" x="615" y="290" text-anchor="middle">Cycle length (ticks)</text>

  <!-- Right bars (correct distribution) -->
  <!-- Scale: max 56.8% → 200px. Factor: 200/57 = 3.5 px/% -->
  <!-- Same tick spacing, starting at x=475 -->
  <rect class="bar-correct" x="475" y="260" width="22" height="0" rx="2"/><!-- 2: 0% -->
  <rect class="bar-correct" x="503" y="260" width="22" height="0" rx="2"/><!-- 3: 0% -->
  <rect class="bar-correct" x="531" y="240" width="22" height="20" rx="2"/><!-- 4: 5.7% -->
  <rect class="bar-correct" x="559" y="61" width="22" height="199" rx="2"/><!-- 5: 56.8% -->
  <rect class="bar-correct" x="587" y="129" width="22" height="131" rx="2"/><!-- 6: 37.5% -->
  <rect class="bar-correct" x="615" y="260" width="22" height="0" rx="2"/><!-- 7: 0% -->
  <rect class="bar-correct" x="643" y="260" width="22" height="0" rx="2"/><!-- 8: 0% -->
  <rect class="bar-correct" x="671" y="260" width="22" height="0" rx="2"/><!-- 9: 0% -->
  <rect class="bar-correct" x="699" y="260" width="22" height="0" rx="2"/><!-- 10: 0% -->
  <rect class="bar-correct" x="727" y="260" width="22" height="0" rx="2"/><!-- 11: 0% -->
  <rect class="bar-correct" x="755" y="260" width="22" height="0" rx="2"/><!-- 12: 0% -->

  <!-- Right tick labels -->
  <text class="tick-label" x="486" y="275" text-anchor="middle">2</text>
  <text class="tick-label" x="514" y="275" text-anchor="middle">3</text>
  <text class="tick-label" x="542" y="275" text-anchor="middle">4</text>
  <text class="tick-label" x="570" y="275" text-anchor="middle">5</text>
  <text class="tick-label" x="598" y="275" text-anchor="middle">6</text>
  <text class="tick-label" x="626" y="275" text-anchor="middle">7</text>
  <text class="tick-label" x="654" y="275" text-anchor="middle">8</text>
  <text class="tick-label" x="682" y="275" text-anchor="middle">9</text>
  <text class="tick-label" x="710" y="275" text-anchor="middle">10</text>
  <text class="tick-label" x="738" y="275" text-anchor="middle">11</text>
  <text class="tick-label" x="766" y="275" text-anchor="middle">12</text>

  <!-- Right stats -->
  <text class="stat" x="680" y="55"><tspan class="stat-val">σ = 0.58</tspan>  mean = 5.32</text>
  <text class="stat" x="680" y="70">range 4–6</text>

  <!-- Footer -->
  <text class="tick-label" x="400" y="330" text-anchor="middle">Same 5 SC2 games, same data, different tracking method</text>
</svg>
