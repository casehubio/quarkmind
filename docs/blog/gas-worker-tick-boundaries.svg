<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <rect width="800" height="420" fill="#1a1a2e" rx="8"/>

  <text x="400" y="32" fill="#e0e0e0" font-size="15" font-weight="600" text-anchor="middle">Gas Worker Cycle — Tick Countdown vs Absolute Loop Timing</text>

  <!-- Legend -->
  <rect x="130" y="48" width="12" height="12" fill="#4a9eff" rx="2"/>
  <text x="148" y="59" fill="#b0b0b0" font-size="11">Walk</text>
  <rect x="210" y="48" width="12" height="12" fill="#ff9f43" rx="2"/>
  <text x="228" y="59" fill="#b0b0b0" font-size="11">Harvest (inside)</text>
  <rect x="345" y="48" width="12" height="12" fill="#54d9a8" rx="2"/>
  <text x="363" y="59" fill="#b0b0b0" font-size="11">Return</text>
  <rect x="430" y="48" width="12" height="12" fill="#8b5cf6" rx="2"/>
  <text x="448" y="59" fill="#b0b0b0" font-size="11">Deposit</text>
  <rect x="520" y="48" width="12" height="12" fill="#e74c3c" opacity="0.5" rx="2"/>
  <text x="538" y="59" fill="#b0b0b0" font-size="11">Wasted (quantised)</text>

  <!-- ═══ BEFORE — tick countdown ═══ -->
  <text x="30" y="100" fill="#e0e0e0" font-size="13" font-weight="600">Tick countdown — cycleLoopsRemaining -= 22</text>
  <text x="30" y="116" fill="#888" font-size="10">32-loop harvest rounds to 44 loops (2 full ticks). Time lost at every transition.</text>

  <g transform="translate(30, 125)">
    <line x1="0" y1="0" x2="0" y2="55" stroke="#444" stroke-width="1"/>
    <line x1="110" y1="0" x2="110" y2="55" stroke="#444" stroke-width="1" stroke-dasharray="4,3"/>
    <line x1="220" y1="0" x2="220" y2="55" stroke="#444" stroke-width="1" stroke-dasharray="4,3"/>
    <line x1="330" y1="0" x2="330" y2="55" stroke="#444" stroke-width="1" stroke-dasharray="4,3"/>
    <line x1="440" y1="0" x2="440" y2="55" stroke="#444" stroke-width="1" stroke-dasharray="4,3"/>
    <line x1="550" y1="0" x2="550" y2="55" stroke="#444" stroke-width="1" stroke-dasharray="4,3"/>
    <line x1="660" y1="0" x2="660" y2="55" stroke="#444" stroke-width="1" stroke-dasharray="4,3"/>
    <line x1="740" y1="0" x2="740" y2="55" stroke="#444" stroke-width="1"/>

    <text x="55" y="-5" fill="#666" font-size="9" text-anchor="middle">tick 1</text>
    <text x="165" y="-5" fill="#666" font-size="9" text-anchor="middle">tick 2</text>
    <text x="275" y="-5" fill="#666" font-size="9" text-anchor="middle">tick 3</text>
    <text x="385" y="-5" fill="#666" font-size="9" text-anchor="middle">tick 4</text>
    <text x="495" y="-5" fill="#666" font-size="9" text-anchor="middle">tick 5</text>
    <text x="605" y="-5" fill="#666" font-size="9" text-anchor="middle">tick 6</text>

    <!-- Walk to geyser -->
    <rect x="1" y="8" width="109" height="22" fill="#4a9eff" rx="3"/>
    <rect x="111" y="8" width="49" height="22" fill="#4a9eff" rx="3"/>
    <!-- Wasted at entry -->
    <rect x="160" y="8" width="59" height="22" fill="#e74c3c" opacity="0.35" rx="3"/>
    <!-- Harvest: 2 full ticks = 44 loops -->
    <rect x="221" y="8" width="108" height="22" fill="#ff9f43" rx="3"/>
    <rect x="331" y="8" width="108" height="22" fill="#ff9f43" rx="3"/>
    <!-- Return walk -->
    <rect x="441" y="8" width="108" height="22" fill="#54d9a8" rx="3"/>
    <rect x="551" y="8" width="49" height="22" fill="#54d9a8" rx="3"/>
    <!-- Wasted at base arrival -->
    <rect x="600" y="8" width="59" height="22" fill="#e74c3c" opacity="0.35" rx="3"/>
    <rect x="661" y="8" width="30" height="22" fill="#8b5cf6" rx="3"/>

    <text x="80" y="23" fill="#fff" font-size="9" text-anchor="middle" opacity="0.9">walk →</text>
    <text x="275" y="23" fill="#fff" font-size="9" text-anchor="middle" opacity="0.9">−22</text>
    <text x="385" y="23" fill="#fff" font-size="9" text-anchor="middle" opacity="0.9">−22 → exit</text>
    <text x="495" y="23" fill="#fff" font-size="9" text-anchor="middle" opacity="0.9">← walk</text>

    <text x="185" y="46" fill="#e74c3c" font-size="9" text-anchor="middle" opacity="0.8">lost</text>
    <text x="625" y="46" fill="#e74c3c" font-size="9" text-anchor="middle" opacity="0.8">lost</text>

    <path d="M221,35 L221,42 L439,42 L439,35" fill="none" stroke="#ff9f43" stroke-width="1" opacity="0.6"/>
    <text x="330" y="55" fill="#ff9f43" font-size="10" text-anchor="middle" opacity="0.8">44 loops effective (should be 31.696)</text>
  </g>

  <!-- ═══ AFTER — absolute loop timing ═══ -->
  <text x="30" y="235" fill="#e0e0e0" font-size="13" font-weight="600">Absolute loop timing — phaseEndLoop = arrivalLoop + 31.696</text>
  <text x="30" y="251" fill="#888" font-size="10">No countdown. No tick awareness. Overflow is exact: tickEnd − phaseEnd.</text>

  <g transform="translate(30, 260)">
    <line x1="0" y1="0" x2="0" y2="70" stroke="#444" stroke-width="1"/>
    <line x1="110" y1="0" x2="110" y2="70" stroke="#444" stroke-width="1" stroke-dasharray="4,3"/>
    <line x1="220" y1="0" x2="220" y2="70" stroke="#444" stroke-width="1" stroke-dasharray="4,3"/>
    <line x1="330" y1="0" x2="330" y2="70" stroke="#444" stroke-width="1" stroke-dasharray="4,3"/>
    <line x1="440" y1="0" x2="440" y2="70" stroke="#444" stroke-width="1" stroke-dasharray="4,3"/>
    <line x1="550" y1="0" x2="550" y2="70" stroke="#444" stroke-width="1" stroke-dasharray="4,3"/>
    <line x1="660" y1="0" x2="660" y2="70" stroke="#444" stroke-width="1" stroke-dasharray="4,3"/>
    <line x1="740" y1="0" x2="740" y2="70" stroke="#444" stroke-width="1"/>

    <text x="55" y="-5" fill="#666" font-size="9" text-anchor="middle">tick 1</text>
    <text x="165" y="-5" fill="#666" font-size="9" text-anchor="middle">tick 2</text>
    <text x="275" y="-5" fill="#666" font-size="9" text-anchor="middle">tick 3</text>
    <text x="385" y="-5" fill="#666" font-size="9" text-anchor="middle">tick 4</text>
    <text x="495" y="-5" fill="#666" font-size="9" text-anchor="middle">tick 5</text>
    <text x="605" y="-5" fill="#666" font-size="9" text-anchor="middle">tick 6</text>

    <!-- Walk to geyser -->
    <rect x="1" y="8" width="109" height="22" fill="#4a9eff" rx="3"/>
    <rect x="111" y="8" width="49" height="22" fill="#4a9eff" rx="3"/>
    <!-- Harvest starts exactly at arrival loop (mid-tick 2) -->
    <rect x="160" y="8" width="99" height="22" fill="#ff9f43" rx="3"/>
    <!-- Harvest continues into tick 3, ends at exact phaseEndLoop -->
    <rect x="261" y="8" width="38" height="22" fill="#ff9f43" rx="3"/>
    <!-- Exit with proportional overflow movement -->
    <rect x="299" y="8" width="30" height="22" fill="#54d9a8" rx="3"/>
    <!-- Continue return -->
    <rect x="331" y="8" width="108" height="22" fill="#54d9a8" rx="3"/>
    <!-- Arrive at base mid-tick, deposit, start back -->
    <rect x="441" y="8" width="25" height="22" fill="#54d9a8" rx="3"/>
    <rect x="468" y="8" width="10" height="22" fill="#8b5cf6" rx="3"/>
    <rect x="480" y="8" width="69" height="22" fill="#4a9eff" rx="3"/>
    <!-- Continue toward geyser -->
    <rect x="551" y="8" width="108" height="22" fill="#4a9eff" rx="3"/>

    <text x="80" y="23" fill="#fff" font-size="9" text-anchor="middle" opacity="0.9">walk →</text>
    <text x="230" y="23" fill="#fff" font-size="9" text-anchor="middle" opacity="0.9">harvest</text>
    <text x="400" y="23" fill="#fff" font-size="9" text-anchor="middle" opacity="0.9">← return</text>
    <text x="530" y="23" fill="#fff" font-size="9" text-anchor="middle" opacity="0.9">walk →</text>

    <!-- Arrival marker -->
    <line x1="160" y1="3" x2="160" y2="35" stroke="#2ecc71" stroke-width="2"/>
    <text x="160" y="46" fill="#2ecc71" font-size="8" text-anchor="middle">arrive</text>
    <text x="160" y="55" fill="#2ecc71" font-size="8" text-anchor="middle">loop 182.4</text>

    <!-- phaseEnd marker -->
    <line x1="299" y1="3" x2="299" y2="35" stroke="#f39c12" stroke-width="2"/>
    <text x="299" y="46" fill="#f39c12" font-size="8" text-anchor="middle">phaseEnd</text>
    <text x="299" y="55" fill="#f39c12" font-size="8" text-anchor="middle">loop 214.1</text>

    <!-- Brace for exact harvest -->
    <path d="M160,35 L160,65 L299,65 L299,35" fill="none" stroke="#ff9f43" stroke-width="1" opacity="0.6"/>
    <text x="230" y="75" fill="#ff9f43" font-size="10" text-anchor="middle" opacity="0.8">exactly 31.696 loops — no rounding</text>
  </g>

  <!-- Result callout -->
  <rect x="30" y="370" width="740" height="40" fill="#1e3a2e" rx="6" stroke="#2ecc71" stroke-width="1" opacity="0.6"/>
  <text x="400" y="390" fill="#2ecc71" font-size="12" text-anchor="middle" font-weight="500">vespeneCollectionRate MAPE: 22.8%  →  19.6%  (−3.2 pp at 7-min checkpoint)</text>
  <text x="400" y="404" fill="#888" font-size="10" text-anchor="middle">118 oracle replays · no formulas · no carry-forward · pure absolute timing</text>
</svg>
