<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="'Inter', 'Segoe UI', system-ui, sans-serif">
  <defs>
    <marker id="arr-g" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#16a34a" stroke-width="1.2"/>
    </marker>
    <marker id="arr-b" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#64748b" stroke-width="1.2"/>
    </marker>
  </defs>

  <text x="360" y="28" text-anchor="middle" font-size="15" font-weight="600" fill="#1e293b">After: Standalone Building Lifecycle</text>

  <rect x="40" y="50" width="200" height="110" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <text x="140" y="75" text-anchor="middle" font-size="12" font-weight="600" fill="#166534">TrackerIntentExtractor</text>
  <text x="140" y="95" text-anchor="middle" font-size="11" fill="#15803d">Reads tracker events once</text>
  <text x="140" y="115" text-anchor="middle" font-size="11" fill="#15803d">Emits typed intents:</text>
  <text x="140" y="133" text-anchor="middle" font-size="10" fill="#15803d">BuildingBornIntent</text>
  <text x="140" y="148" text-anchor="middle" font-size="10" fill="#15803d">BuildIntent · MorphIntent</text>

  <rect x="480" y="50" width="200" height="110" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="580" y="75" text-anchor="middle" font-size="12" font-weight="600" fill="#1e40af">EmulatedGame</text>
  <text x="580" y="95" text-anchor="middle" font-size="11" fill="#3b82f6">Owns its own state</text>
  <text x="580" y="115" text-anchor="middle" font-size="11" fill="#3b82f6">Construction timers</text>
  <text x="580" y="133" text-anchor="middle" font-size="11" fill="#3b82f6">Morphs · Reactors</text>
  <text x="580" y="148" text-anchor="middle" font-size="11" fill="#3b82f6">Supply · Destruction</text>

  <line x1="240" y1="80" x2="475" y2="80" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arr-g)"/>
  <text x="358" y="74" text-anchor="middle" font-size="10" font-weight="500" fill="#16a34a">BuildingBornIntent (loop 0)</text>

  <line x1="240" y1="105" x2="475" y2="105" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arr-g)"/>
  <text x="358" y="100" text-anchor="middle" font-size="10" font-weight="500" fill="#16a34a">BuildIntent + pinned completion</text>

  <line x1="240" y1="130" x2="475" y2="130" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arr-g)"/>
  <text x="358" y="125" text-anchor="middle" font-size="10" font-weight="500" fill="#16a34a">MorphIntent (Lair, OrbitalCommand…)</text>

  <line x1="240" y1="155" x2="475" y2="155" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr-b)"/>
  <text x="358" y="150" text-anchor="middle" font-size="10" fill="#64748b">TrainIntent · ResearchIntent</text>

  <rect x="100" y="200" width="520" height="160" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
  <text x="360" y="225" text-anchor="middle" font-size="12" font-weight="600" fill="#166534">What This Unlocks</text>
  <text x="360" y="250" text-anchor="middle" font-size="11" fill="#14532d">EmulatedGame manages its own building lifecycle — construction</text>
  <text x="360" y="268" text-anchor="middle" font-size="11" fill="#14532d">timing, supply, morphs, Reactor detection, destruction.</text>
  <text x="360" y="293" text-anchor="middle" font-size="11" fill="#14532d">Training-grade fidelity: run thousands of games per second</text>
  <text x="360" y="311" text-anchor="middle" font-size="11" fill="#14532d">without SC2 installed. Buildings drive production, supply,</text>
  <text x="360" y="329" text-anchor="middle" font-size="11" fill="#14532d">and the tech tree — the hardest sync to eliminate because</text>
  <text x="360" y="347" text-anchor="middle" font-size="11" fill="#14532d">getting one building wrong cascades into everything.</text>
</svg>
