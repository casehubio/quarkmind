<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#475569"/>
    </marker>
  </defs>

  <style>
    .title { font-size: 14px; font-weight: 600; fill: #1e293b; }
    .label { font-size: 11px; fill: #475569; }
    .tick-label { font-size: 10px; fill: #64748b; font-family: monospace; }
    .box-walk { fill: #dbeafe; stroke: #3b82f6; stroke-width: 1.5; rx: 4; }
    .box-harvest { fill: #fef3c7; stroke: #f59e0b; stroke-width: 1.5; rx: 4; }
    .box-waste { fill: #fee2e2; stroke: #ef4444; stroke-width: 1.5; rx: 4; }
    .box-deposit { fill: #d1fae5; stroke: #10b981; stroke-width: 1.5; rx: 4; }
    .box-fixed { fill: #e0f2fe; stroke: #0ea5e9; stroke-width: 1.5; rx: 4; }
  </style>

  <!-- Title -->
  <text x="360" y="24" text-anchor="middle" class="title">Gas Worker Trip Cycle — Before and After</text>

  <!-- Before row -->
  <text x="20" y="75" class="label" font-weight="600">Before</text>
  <text x="20" y="90" class="label">(6 ticks)</text>

  <rect x="90" y="55" width="90" height="40" class="box-walk"/>
  <text x="135" y="79" text-anchor="middle" class="tick-label">Walk →</text>

  <rect x="190" y="55" width="90" height="40" class="box-harvest"/>
  <text x="235" y="79" text-anchor="middle" class="tick-label">Harvest</text>

  <rect x="290" y="55" width="90" height="40" class="box-waste"/>
  <text x="335" y="72" text-anchor="middle" class="tick-label">Exit</text>
  <text x="335" y="86" text-anchor="middle" class="tick-label">(idle tick)</text>

  <rect x="390" y="55" width="90" height="40" class="box-walk"/>
  <text x="435" y="79" text-anchor="middle" class="tick-label">← Walk</text>

  <rect x="490" y="55" width="90" height="40" class="box-deposit"/>
  <text x="535" y="79" text-anchor="middle" class="tick-label">Deposit</text>

  <rect x="590" y="55" width="90" height="40" class="box-waste"/>
  <text x="635" y="72" text-anchor="middle" class="tick-label">Switch</text>
  <text x="635" y="86" text-anchor="middle" class="tick-label">(idle tick)</text>

  <!-- Tick labels Before -->
  <text x="135" y="110" text-anchor="middle" class="tick-label">T1-T2</text>
  <text x="235" y="110" text-anchor="middle" class="tick-label">T3-T4</text>
  <text x="335" y="110" text-anchor="middle" class="tick-label">T5</text>
  <text x="435" y="110" text-anchor="middle" class="tick-label">T5-T6</text>
  <text x="535" y="110" text-anchor="middle" class="tick-label">T6</text>
  <text x="635" y="110" text-anchor="middle" class="tick-label">T7</text>

  <!-- Rate label -->
  <text x="680" y="79" class="label" font-weight="600" fill="#ef4444">4 gas</text>
  <text x="680" y="93" class="label" fill="#ef4444">/ 6 ticks</text>

  <!-- Separator -->
  <line x1="80" y1="130" x2="700" y2="130" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- After row -->
  <text x="20" y="175" class="label" font-weight="600">After</text>
  <text x="20" y="190" class="label">(5 ticks)</text>

  <rect x="90" y="155" width="100" height="40" class="box-walk"/>
  <text x="140" y="179" text-anchor="middle" class="tick-label">Walk →</text>

  <rect x="200" y="155" width="100" height="40" class="box-harvest"/>
  <text x="250" y="179" text-anchor="middle" class="tick-label">Harvest</text>

  <rect x="310" y="155" width="120" height="40" class="box-fixed"/>
  <text x="370" y="172" text-anchor="middle" class="tick-label">Exit +</text>
  <text x="370" y="186" text-anchor="middle" class="tick-label">start walking</text>

  <rect x="440" y="155" width="80" height="40" class="box-walk"/>
  <text x="480" y="179" text-anchor="middle" class="tick-label">← Walk</text>

  <rect x="530" y="155" width="80" height="40" class="box-deposit"/>
  <text x="570" y="179" text-anchor="middle" class="tick-label">Deposit</text>

  <!-- Rate label -->
  <text x="630" y="175" class="label" font-weight="600" fill="#10b981">4 gas</text>
  <text x="630" y="189" class="label" fill="#10b981">/ 5 ticks</text>

  <!-- Tick labels After -->
  <text x="140" y="210" text-anchor="middle" class="tick-label">T1-T2</text>
  <text x="250" y="210" text-anchor="middle" class="tick-label">T3-T4</text>
  <text x="370" y="210" text-anchor="middle" class="tick-label">T4*</text>
  <text x="480" y="210" text-anchor="middle" class="tick-label">T5</text>
  <text x="570" y="210" text-anchor="middle" class="tick-label">T5</text>

  <!-- Annotation -->
  <text x="360" y="250" text-anchor="middle" class="label" font-style="italic">
    * Harvest completion and walking happen in the same tick — no wasted transition
  </text>

  <!-- Improvement -->
  <rect x="200" y="270" width="320" height="36" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="360" y="293" text-anchor="middle" font-size="13" font-weight="600" fill="#166534">
    +20% gas income per worker per trip
  </text>
</svg>
