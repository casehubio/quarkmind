<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="'Inter', 'Segoe UI', system-ui, sans-serif">
  <defs>
    <marker id="arrow-b" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#64748b" stroke-width="1.2"/>
    </marker>
    <marker id="arrow-r" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#dc2626" stroke-width="1.2"/>
    </marker>
  </defs>

  <text x="360" y="28" text-anchor="middle" font-size="15" font-weight="600" fill="#1e293b">Before: Ground Truth Sync</text>

  <rect x="40" y="50" width="200" height="100" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="140" y="75" text-anchor="middle" font-size="13" font-weight="600" fill="#334155">ReplaySimulatedGame</text>
  <text x="140" y="95" text-anchor="middle" font-size="11" fill="#64748b">Ground Truth</text>
  <text x="140" y="115" text-anchor="middle" font-size="11" fill="#64748b">UnitInit, UnitDone,</text>
  <text x="140" y="130" text-anchor="middle" font-size="11" fill="#64748b">UnitBorn, UnitDied</text>

  <rect x="480" y="50" width="200" height="100" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="580" y="75" text-anchor="middle" font-size="13" font-weight="600" fill="#1e40af">EmulatedGame</text>
  <text x="580" y="95" text-anchor="middle" font-size="11" fill="#3b82f6">Physics Simulation</text>
  <text x="580" y="115" text-anchor="middle" font-size="11" fill="#3b82f6">handleBuild, handleTrain,</text>
  <text x="580" y="130" text-anchor="middle" font-size="11" fill="#3b82f6">handleMorph</text>

  <line x1="240" y1="100" x2="475" y2="100" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrow-r)"/>
  <text x="358" y="90" text-anchor="middle" font-size="12" font-weight="600" fill="#dc2626">syncBuildings()</text>
  <text x="358" y="108" text-anchor="middle" font-size="10" fill="#dc2626">every tick — inject, sync, mark</text>

  <line x1="358" y1="170" x2="475" y2="130" stroke="#64748b" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arrow-b)"/>
  <text x="390" y="165" text-anchor="middle" font-size="10" fill="#64748b">TrainIntents</text>

  <rect x="100" y="200" width="520" height="120" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
  <text x="360" y="225" text-anchor="middle" font-size="12" font-weight="600" fill="#991b1b">The Problem</text>
  <text x="360" y="248" text-anchor="middle" font-size="11" fill="#7f1d1d">EmulatedGame doesn't know how to create its own buildings.</text>
  <text x="360" y="266" text-anchor="middle" font-size="11" fill="#7f1d1d">Every tick, the harness overwrites EmulatedGame's building state</text>
  <text x="360" y="284" text-anchor="middle" font-size="11" fill="#7f1d1d">with what the replay says should exist. Construction timing,</text>
  <text x="360" y="302" text-anchor="middle" font-size="11" fill="#7f1d1d">morphs, destruction — all bypassed. No learning possible.</text>
</svg>
