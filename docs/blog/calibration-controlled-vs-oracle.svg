<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="720" height="420" fill="url(#bgGrad)" rx="8"/>

  <!-- Title -->
  <text x="360" y="35" fill="#e0e0e0" font-size="16" font-weight="600" text-anchor="middle">Per-Worker Mineral Income: Controlled SC2 vs Oracle-Derived</text>
  <text x="360" y="55" fill="#888" font-size="12" text-anchor="middle">Protoss, 12 workers, 1 base, 5-minute measurement</text>

  <!-- Y-axis -->
  <line x1="100" y1="80" x2="100" y2="340" stroke="#444" stroke-width="1"/>
  <text x="50" y="215" fill="#aaa" font-size="12" text-anchor="middle" transform="rotate(-90,50,215)">minerals / min / worker</text>

  <!-- Y-axis labels and gridlines -->
  <text x="90" y="340" fill="#888" font-size="11" text-anchor="end">0</text>
  <line x1="100" y1="340" x2="660" y2="340" stroke="#333" stroke-width="0.5"/>

  <text x="90" y="288" fill="#888" font-size="11" text-anchor="end">20</text>
  <line x1="100" y1="288" x2="660" y2="288" stroke="#333" stroke-width="0.5"/>

  <text x="90" y="236" fill="#888" font-size="11" text-anchor="end">40</text>
  <line x1="100" y1="236" x2="660" y2="236" stroke="#333" stroke-width="0.5"/>

  <text x="90" y="184" fill="#888" font-size="11" text-anchor="end">60</text>
  <line x1="100" y1="184" x2="660" y2="184" stroke="#333" stroke-width="0.5" stroke-dasharray="4,4"/>

  <text x="90" y="132" fill="#888" font-size="11" text-anchor="end">80</text>
  <line x1="100" y1="132" x2="660" y2="132" stroke="#333" stroke-width="0.5"/>

  <!-- X-axis -->
  <line x1="100" y1="340" x2="660" y2="340" stroke="#444" stroke-width="1"/>

  <!-- Bar group 1: SC2 Controlled (the truth) -->
  <rect x="140" y="192" width="80" height="148" fill="#4ecdc4" rx="3" opacity="0.9"/>
  <text x="180" y="186" fill="#4ecdc4" font-size="14" font-weight="600" text-anchor="middle">56.9</text>
  <text x="180" y="365" fill="#ccc" font-size="12" text-anchor="middle">SC2 Real</text>
  <text x="180" y="380" fill="#888" font-size="10" text-anchor="middle">(controlled)</text>

  <!-- Bar group 2: EM Model (no factor) -->
  <rect x="260" y="184" width="80" height="156" fill="#6c8ebf" rx="3" opacity="0.9"/>
  <text x="300" y="178" fill="#6c8ebf" font-size="14" font-weight="600" text-anchor="middle">60.0</text>
  <text x="300" y="365" fill="#ccc" font-size="12" text-anchor="middle">EM Model</text>
  <text x="300" y="380" fill="#888" font-size="10" text-anchor="middle">(factor = 1.0)</text>

  <!-- Bar group 3: EM with Oracle factor 1.18 (wrong) -->
  <rect x="380" y="157" width="80" height="183" fill="#e74c3c" rx="3" opacity="0.9"/>
  <text x="420" y="151" fill="#e74c3c" font-size="14" font-weight="600" text-anchor="middle">70.8</text>
  <text x="420" y="365" fill="#ccc" font-size="12" text-anchor="middle">Oracle Factor</text>
  <text x="420" y="380" fill="#888" font-size="10" text-anchor="middle">(1.18 — wrong)</text>

  <!-- Bar group 4: EM with SC2 factor 0.95 (correct) -->
  <rect x="500" y="192" width="80" height="148" fill="#2ecc71" rx="3" opacity="0.9"/>
  <text x="540" y="186" fill="#2ecc71" font-size="14" font-weight="600" text-anchor="middle">56.9</text>
  <text x="540" y="365" fill="#ccc" font-size="12" text-anchor="middle">SC2 Factor</text>
  <text x="540" y="380" fill="#888" font-size="10" text-anchor="middle">(0.95 — correct)</text>

  <!-- Reference line: SC2 real rate -->
  <line x1="130" y1="192" x2="590" y2="192" stroke="#4ecdc4" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.6"/>
  <text x="610" y="196" fill="#4ecdc4" font-size="10">SC2 real</text>

  <!-- Annotations -->
  <!-- Arrow from Oracle to SC2 real showing the error -->
  <line x1="420" y1="160" x2="420" y2="195" stroke="#e74c3c" stroke-width="2" opacity="0.5"/>
  <text x="450" y="172" fill="#e74c3c" font-size="10" font-style="italic">+24% over</text>

  <!-- Arrow from EM to SC2 real -->
  <line x1="300" y1="187" x2="300" y2="195" stroke="#6c8ebf" stroke-width="2" opacity="0.5"/>
  <text x="325" y="200" fill="#6c8ebf" font-size="10" font-style="italic">+5% over</text>

  <!-- Legend box -->
  <rect x="130" y="395" width="520" height="20" fill="none"/>
  <text x="360" y="410" fill="#666" font-size="10" text-anchor="middle">Oracle-derived factor (1.18) compensated for worker allocation gaps, not per-worker physics. SC2 playbook revealed the true 5% delta.</text>
</svg>
