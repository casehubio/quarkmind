<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="'SF Mono', 'Menlo', monospace" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="720" height="380" fill="#fafafa" rx="6"/>

  <!-- Title -->
  <text x="360" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">Patch State Machine &amp; Worker Decision</text>

  <!-- IDLE state -->
  <rect x="40" y="60" width="160" height="70" rx="8" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="120" y="88" text-anchor="middle" font-weight="bold" fill="#155724">IDLE</text>
  <text x="120" y="106" text-anchor="middle" font-size="11" fill="#155724">no miner, lock expired</text>

  <!-- ACTIVE state -->
  <rect x="280" y="60" width="160" height="70" rx="8" fill="#cce5ff" stroke="#0d6efd" stroke-width="2"/>
  <text x="360" y="88" text-anchor="middle" font-weight="bold" fill="#084298">ACTIVE</text>
  <text x="360" y="106" text-anchor="middle" font-size="11" fill="#084298">miner inside</text>

  <!-- COOLDOWN state -->
  <rect x="520" y="60" width="160" height="70" rx="8" fill="#fff3cd" stroke="#ffc107" stroke-width="2"/>
  <text x="600" y="88" text-anchor="middle" font-weight="bold" fill="#664d03">COOLDOWN</text>
  <text x="600" y="106" text-anchor="middle" font-size="11" fill="#664d03">lock period (22L)</text>

  <!-- Transitions between states -->
  <line x1="200" y1="95" x2="278" y2="95" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="239" y="86" text-anchor="middle" font-size="10" fill="#555">worker starts</text>

  <line x1="440" y1="95" x2="518" y2="95" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="479" y="86" text-anchor="middle" font-size="10" fill="#555">miner departs</text>

  <path d="M 600 130 Q 600 160 360 160 Q 120 160 120 130" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="360" y="155" text-anchor="middle" font-size="10" fill="#555">lock expires</text>

  <!-- Worker decision box -->
  <rect x="60" y="200" width="600" height="150" rx="6" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1"/>
  <text x="360" y="222" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">Worker arrives at patch</text>

  <!-- Decision branches -->
  <rect x="80" y="240" width="240" height="48" rx="4" fill="#d4edda" stroke="#28a745"/>
  <text x="200" y="260" text-anchor="middle" font-size="11" fill="#155724" font-weight="bold">Patch IDLE → mine immediately</text>
  <text x="200" y="276" text-anchor="middle" font-size="11" fill="#155724">approach = 0 loops</text>

  <rect x="400" y="240" width="240" height="48" rx="4" fill="#cce5ff" stroke="#0d6efd"/>
  <text x="520" y="260" text-anchor="middle" font-size="11" fill="#084298" font-weight="bold">Patch occupied → wait</text>
  <text x="520" y="276" text-anchor="middle" font-size="11" fill="#084298">approach = 11 loops when freed</text>

  <rect x="400" y="300" width="240" height="36" rx="4" fill="#fff3cd" stroke="#ffc107"/>
  <text x="520" y="323" text-anchor="middle" font-size="11" fill="#664d03">wait > 22L → scan for idle patch</text>
</svg>
