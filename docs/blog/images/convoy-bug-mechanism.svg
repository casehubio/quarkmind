<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="'Segoe UI', system-ui, sans-serif">
  <style>
    text { font-size: 12px; fill: #2d3748; }
    .title { font-size: 14px; font-weight: 600; }
    .label { font-size: 11px; fill: #4a5568; }
    .small { font-size: 10px; fill: #718096; }
    .patch { fill: #c3dafe; stroke: #4299e1; stroke-width: 1.5; rx: 6; ry: 6; }
    .patch-hot { fill: #fed7d7; stroke: #f56565; stroke-width: 2; rx: 6; ry: 6; }
    .worker { fill: #4299e1; }
    .worker-idle { fill: #cbd5e0; }
    .base { fill: #f7fafc; stroke: #a0aec0; stroke-width: 1; rx: 8; ry: 8; }
    .arrow { stroke: #718096; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead); }
    .divider { stroke: #e2e8f0; stroke-width: 1; stroke-dasharray: 4,4; }
  </style>

  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#718096"/>
    </marker>
  </defs>

  <text x="360" y="24" text-anchor="middle" class="title">The Convoy Bug: Why Workers Converge on One Patch</text>

  <!-- Left panel: Cycle 1 (correct) -->
  <text x="180" y="50" text-anchor="middle" class="label" font-weight="600">Cycle 1 — Initial Assignment</text>
  <text x="180" y="65" text-anchor="middle" class="small">(workers distributed correctly)</text>

  <!-- Base -->
  <rect x="130" y="240" width="100" height="40" class="base"/>
  <text x="180" y="264" text-anchor="middle" class="label">Town Hall</text>

  <!-- Patches (8 arranged in arc) -->
  <rect x="60" y="90" width="50" height="28" class="patch"/>
  <text x="85" y="108" text-anchor="middle" class="small">Patch 0</text>
  <circle cx="75" cy="125" r="5" class="worker"/>
  <circle cx="95" cy="125" r="5" class="worker"/>

  <rect x="120" y="80" width="50" height="28" class="patch"/>
  <text x="145" y="98" text-anchor="middle" class="small">Patch 1</text>
  <circle cx="135" cy="115" r="5" class="worker"/>
  <circle cx="155" cy="115" r="5" class="worker"/>

  <rect x="180" y="76" width="50" height="28" class="patch"/>
  <text x="205" y="94" text-anchor="middle" class="small">Patch 2</text>
  <circle cx="195" cy="111" r="5" class="worker"/>
  <circle cx="215" cy="111" r="5" class="worker"/>

  <rect x="240" y="80" width="50" height="28" class="patch"/>
  <text x="265" y="98" text-anchor="middle" class="small">Patch 3</text>
  <circle cx="255" cy="115" r="5" class="worker"/>
  <circle cx="275" cy="115" r="5" class="worker"/>

  <text x="180" y="210" text-anchor="middle" class="small">16 workers across 8 patches</text>
  <text x="180" y="222" text-anchor="middle" class="small" fill="#48bb78" font-weight="600">All mining ✓</text>

  <!-- Divider -->
  <line x1="360" y1="40" x2="360" y2="340" class="divider"/>

  <!-- Right panel: Cycle 2 (convoy) -->
  <text x="540" y="50" text-anchor="middle" class="label" font-weight="600">Cycle 2 — After First Deposit</text>
  <text x="540" y="65" text-anchor="middle" class="small">(miners list empty during reassignment)</text>

  <!-- Base -->
  <rect x="490" y="240" width="100" height="40" class="base"/>
  <text x="540" y="264" text-anchor="middle" class="label">Town Hall</text>

  <!-- Patch 0 (hot — all workers converge here) -->
  <rect x="420" y="90" width="50" height="28" class="patch-hot"/>
  <text x="445" y="108" text-anchor="middle" class="small">Patch 0</text>
  <!-- Crowd of workers -->
  <circle cx="425" cy="125" r="5" class="worker"/>
  <circle cx="437" cy="125" r="5" class="worker"/>
  <circle cx="449" cy="130" r="5" class="worker-idle"/>
  <circle cx="461" cy="130" r="5" class="worker-idle"/>
  <circle cx="425" cy="140" r="5" class="worker-idle"/>
  <circle cx="437" cy="140" r="5" class="worker-idle"/>
  <circle cx="449" cy="140" r="5" class="worker-idle"/>
  <circle cx="461" cy="140" r="5" class="worker-idle"/>
  <circle cx="425" cy="150" r="5" class="worker-idle"/>
  <circle cx="437" cy="150" r="5" class="worker-idle"/>
  <circle cx="449" cy="150" r="5" class="worker-idle"/>
  <circle cx="461" cy="150" r="5" class="worker-idle"/>
  <circle cx="425" cy="160" r="5" class="worker-idle"/>
  <circle cx="437" cy="160" r="5" class="worker-idle"/>
  <circle cx="449" cy="160" r="5" class="worker-idle"/>
  <circle cx="461" cy="160" r="5" class="worker-idle"/>

  <!-- Empty patches -->
  <rect x="480" y="80" width="50" height="28" class="patch"/>
  <text x="505" y="98" text-anchor="middle" class="small">Patch 1</text>

  <rect x="540" y="76" width="50" height="28" class="patch"/>
  <text x="565" y="94" text-anchor="middle" class="small">Patch 2</text>

  <rect x="600" y="80" width="50" height="28" class="patch"/>
  <text x="625" y="98" text-anchor="middle" class="small">Patch 3</text>

  <text x="540" y="195" text-anchor="middle" class="small">16 workers, all on Patch 0</text>
  <text x="540" y="207" text-anchor="middle" class="small" fill="#f56565" font-weight="600">14 idle, 2 mining ✗</text>

  <!-- Explanation -->
  <rect x="390" y="290" width="310" height="55" fill="#fffbeb" stroke="#f6e05e" stroke-width="1" rx="6"/>
  <text x="545" y="308" text-anchor="middle" class="small" font-weight="600">Why?</text>
  <text x="545" y="322" text-anchor="middle" class="small">Workers removed from miners on harvest.</text>
  <text x="545" y="336" text-anchor="middle" class="small">All patches show 0 miners → all pick Patch 0.</text>
</svg>
