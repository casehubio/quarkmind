<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280">
  <defs>
    <style>
      .bg { fill: #fafafa; }
      .box { rx: 6; stroke-width: 1.5; }
      .box-code { fill: #f8fafc; stroke: #94a3b8; }
      .box-bug { fill: #fef2f2; stroke: #ef4444; }
      .box-fix { fill: #f0fdf4; stroke: #22c55e; }
      .label { font-family: 'Inter', 'Segoe UI', sans-serif; font-size: 11px; fill: #64748b; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
      .code { font-family: 'JetBrains Mono', 'SF Mono', monospace; font-size: 11px; fill: #334155; }
      .code-hl { font-family: 'JetBrains Mono', 'SF Mono', monospace; font-size: 11px; fill: #dc2626; font-weight: 700; }
      .code-fix { font-family: 'JetBrains Mono', 'SF Mono', monospace; font-size: 11px; fill: #16a34a; font-weight: 700; }
      .arrow { stroke: #94a3b8; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead); }
      .effect { font-family: 'Inter', 'Segoe UI', sans-serif; font-size: 11px; fill: #334155; }
      .title { font-family: 'Inter', 'Segoe UI', sans-serif; font-size: 14px; fill: #0f172a; font-weight: 700; }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="640" height="280" class="bg" rx="8"/>
  <text x="320" y="24" text-anchor="middle" class="title">False Reactor Detection</text>

  <!-- Condition box -->
  <rect x="20" y="40" width="280" height="70" class="box box-code"/>
  <text x="30" y="56" class="label">Reactor auto-detection</text>
  <text x="30" y="74" class="code">if (autoResolved &amp;&amp; activeSlots == 1)</text>
  <text x="30" y="90" class="code">  Math.abs(absLoop - prevStart)</text>
  <text x="30" y="102" class="code-hl">  ≤ 10  →  maxConcurrent = 2</text>

  <!-- Bug explanation -->
  <rect x="340" y="40" width="280" height="70" class="box box-bug"/>
  <text x="350" y="56" class="label">The bug</text>
  <text x="350" y="74" class="code">Playbook intents: absLoop = 0</text>
  <text x="350" y="90" class="code">prevStartLoop = 272 − 272 = 0</text>
  <text x="350" y="102" class="code-hl">|0 − 0| = 0 ≤ 10 → always true!</text>

  <line x1="300" y1="75" x2="340" y2="75" class="arrow"/>

  <!-- Effect -->
  <rect x="20" y="130" width="280" height="50" class="box box-bug"/>
  <text x="30" y="146" class="label">Effect</text>
  <text x="30" y="165" class="effect">Nexus trains 2 Probes concurrently</text>
  <text x="30" y="178" class="effect">(as if it had a Reactor attached)</text>

  <!-- Fix -->
  <rect x="340" y="130" width="280" height="50" class="box box-fix"/>
  <text x="350" y="146" class="label">Fix</text>
  <text x="350" y="165" class="code">if (<tspan class="code-fix">trackerDriven</tspan> &amp;&amp; autoResolved</text>
  <text x="350" y="178" class="code">    &amp;&amp; activeSlots == 1)</text>

  <!-- Impact -->
  <rect x="20" y="200" width="600" height="60" class="box box-code"/>
  <text x="30" y="218" class="label">Impact on calibration</text>
  <text x="30" y="238" class="effect">Before fix: EM trains Probes 2x faster than SC2 from tick 7 onward — supplyUsed jumps to 14</text>
  <text x="30" y="252" class="effect">After fix: EM and SC2 supplyUsed match exactly through tick 25 (Probe count tracks 1:1)</text>
</svg>
