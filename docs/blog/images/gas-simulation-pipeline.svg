<svg viewBox="0 0 780 380" xmlns="http://www.w3.org/2000/svg" style="max-width:100%;font-family:system-ui,sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#475569"/></marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#dc2626"/></marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#16a34a"/></marker>
  </defs>

  <!-- Title -->
  <text x="390" y="28" text-anchor="middle" font-size="15" fill="#1e293b" font-weight="700">Gas Income: Formula vs Simulation</text>

  <!-- Before: Formula path (top, red-ish) -->
  <text x="60" y="72" font-size="12" fill="#991b1b" font-weight="600">BEFORE — Formula</text>

  <rect x="40" y="85" width="140" height="50" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="110" y="107" text-anchor="middle" font-size="10" fill="#991b1b" font-weight="600">Count gas slots</text>
  <text x="110" y="121" text-anchor="middle" font-size="9" fill="#b91c1c">slot.assignedWorkers</text>

  <line x1="180" y1="110" x2="220" y2="110" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-red)"/>

  <rect x="220" y="85" width="160" height="50" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="300" y="107" text-anchor="middle" font-size="10" fill="#991b1b" font-weight="600">Look up tier rates</text>
  <text x="300" y="121" text-anchor="middle" font-size="9" fill="#b91c1c">54.8 / 54.8 / 28.8 gas·min⁻¹</text>

  <line x1="380" y1="110" x2="420" y2="110" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-red)"/>

  <rect x="420" y="85" width="140" height="50" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="490" y="107" text-anchor="middle" font-size="10" fill="#991b1b" font-weight="600">Sum per geyser</text>
  <text x="490" y="121" text-anchor="middle" font-size="9" fill="#b91c1c">gasIncomePerTick(n)</text>

  <line x1="560" y1="110" x2="600" y2="110" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-red)"/>

  <rect x="600" y="85" width="140" height="50" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="670" y="107" text-anchor="middle" font-size="10" fill="#991b1b" font-weight="600">~46 gas·min⁻¹/w</text>
  <text x="670" y="121" text-anchor="middle" font-size="9" fill="#b91c1c">No walk, no physics</text>

  <!-- After: Simulation path (bottom, green) -->
  <text x="60" y="182" font-size="12" fill="#166534" font-weight="600">AFTER — Simulation</text>

  <rect x="40" y="195" width="110" height="65" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="95" y="217" text-anchor="middle" font-size="10" fill="#166534" font-weight="600">Walk to</text>
  <text x="95" y="231" text-anchor="middle" font-size="10" fill="#166534" font-weight="600">geyser</text>
  <text x="95" y="247" text-anchor="middle" font-size="9" fill="#4ade80">3.94 units/sec</text>

  <line x1="150" y1="227" x2="180" y2="227" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <rect x="180" y="195" width="110" height="65" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="235" y="217" text-anchor="middle" font-size="10" fill="#166534" font-weight="600">Enter +</text>
  <text x="235" y="231" text-anchor="middle" font-size="10" fill="#166534" font-weight="600">harvest</text>
  <text x="235" y="247" text-anchor="middle" font-size="9" fill="#4ade80">1.415s (32 loops)</text>

  <line x1="290" y1="227" x2="320" y2="227" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <rect x="320" y="195" width="110" height="65" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="375" y="217" text-anchor="middle" font-size="10" fill="#166534" font-weight="600">Exit with</text>
  <text x="375" y="231" text-anchor="middle" font-size="10" fill="#166534" font-weight="600">cargo</text>
  <text x="375" y="247" text-anchor="middle" font-size="9" fill="#4ade80">4.0 gas per trip</text>

  <line x1="430" y1="227" x2="460" y2="227" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <rect x="460" y="195" width="110" height="65" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="515" y="217" text-anchor="middle" font-size="10" fill="#166534" font-weight="600">Walk back</text>
  <text x="515" y="231" text-anchor="middle" font-size="10" fill="#166534" font-weight="600">+ deposit</text>
  <text x="515" y="247" text-anchor="middle" font-size="9" fill="#4ade80">~7.6 map units</text>

  <line x1="570" y1="227" x2="600" y2="227" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <rect x="600" y="195" width="140" height="65" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="670" y="217" text-anchor="middle" font-size="10" fill="#166534" font-weight="600">~45 gas·min⁻¹/w</text>
  <text x="670" y="237" text-anchor="middle" font-size="9" fill="#4ade80">Real walk distances</text>
  <text x="670" y="251" text-anchor="middle" font-size="9" fill="#4ade80">Map-aware physics</text>

  <!-- Curved return arrow for simulation loop -->
  <path d="M 515 260 L 515 290 Q 515 305 500 305 L 110 305 Q 95 305 95 290 L 95 260" fill="none" stroke="#16a34a" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arr-green)"/>
  <text x="305" y="320" text-anchor="middle" font-size="9" fill="#166534" font-style="italic">repeat each tick per worker</text>

  <!-- Bottom comparison box -->
  <rect x="140" y="340" width="500" height="32" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="390" y="361" text-anchor="middle" font-size="11" fill="#475569">Formula retained in compareWithFormula() — validation only, not production path</text>
</svg>
