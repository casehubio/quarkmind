<svg viewBox="0 0 820 360" xmlns="http://www.w3.org/2000/svg" style="max-width:100%;font-family:system-ui,sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#475569"/></marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#dc2626"/></marker>
  </defs>

  <!-- Title -->
  <text x="410" y="28" text-anchor="middle" font-size="15" fill="#1e293b" font-weight="700">The Phantom Zergling Problem</text>
  <text x="410" y="48" text-anchor="middle" font-size="11" fill="#94a3b8">Each UnitBorn event triggered a batch spawn: 2 x 2 = 4 per real pair</text>

  <!-- SC2 Reality -->
  <rect x="20" y="70" width="180" height="130" rx="10" fill="#eff6ff" stroke="#0284c7" stroke-width="1.5"/>
  <text x="110" y="92" text-anchor="middle" font-size="12" fill="#0c4a6e" font-weight="700">SC2 Tracker</text>
  <text x="110" y="115" text-anchor="middle" font-size="11" fill="#0369a1">1 pair trained</text>
  <text x="110" y="135" text-anchor="middle" font-size="11" fill="#0369a1">= 2 real Zerglings</text>

  <rect x="40" y="150" width="60" height="30" rx="4" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
  <text x="70" y="170" text-anchor="middle" font-size="10" fill="#0c4a6e">UnitBorn</text>

  <rect x="120" y="150" width="60" height="30" rx="4" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
  <text x="150" y="170" text-anchor="middle" font-size="10" fill="#0c4a6e">UnitBorn</text>

  <!-- Extractor -->
  <rect x="250" y="90" width="160" height="60" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="330" y="116" text-anchor="middle" font-size="12" fill="#334155" font-weight="600">Extractor</text>
  <text x="330" y="134" text-anchor="middle" font-size="10" fill="#64748b">1 TrainIntent per event</text>

  <!-- Two TrainIntents -->
  <rect x="250" y="175" width="70" height="35" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <text x="285" y="196" text-anchor="middle" font-size="10" fill="#92400e" font-weight="600">Intent 1</text>

  <rect x="340" y="175" width="70" height="35" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <text x="375" y="196" text-anchor="middle" font-size="10" fill="#92400e" font-weight="600">Intent 2</text>

  <!-- startTraining -->
  <rect x="470" y="80" width="180" height="70" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="560" y="105" text-anchor="middle" font-size="12" fill="#991b1b" font-weight="600">startTraining()</text>
  <text x="560" y="125" text-anchor="middle" font-size="10" fill="#dc2626">spawn trainCount(Zergling)</text>
  <text x="560" y="140" text-anchor="middle" font-size="11" fill="#991b1b" font-weight="700">= 2 per intent</text>

  <!-- Bug output: 4 Zerglings -->
  <rect x="470" y="175" width="40" height="35" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
  <text x="490" y="197" text-anchor="middle" font-size="9" fill="#991b1b">Z1</text>
  <rect x="520" y="175" width="40" height="35" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
  <text x="540" y="197" text-anchor="middle" font-size="9" fill="#991b1b">Z2</text>
  <rect x="570" y="175" width="40" height="35" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
  <text x="590" y="197" text-anchor="middle" font-size="9" fill="#991b1b">Z3</text>
  <rect x="620" y="175" width="40" height="35" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
  <text x="640" y="197" text-anchor="middle" font-size="9" fill="#991b1b">Z4</text>

  <!-- Bug label -->
  <rect x="490" y="220" width="140" height="25" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="560" y="237" text-anchor="middle" font-size="11" fill="#991b1b" font-weight="700">4 phantom Zerglings!</text>

  <!-- Fix section -->
  <rect x="20" y="270" width="780" height="75" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="410" y="292" text-anchor="middle" font-size="12" fill="#14532d" font-weight="700">Fix: tracker-driven mode spawns 1 per event</text>
  <text x="410" y="312" text-anchor="middle" font-size="11" fill="#166534">spawnCount = trackerDriven ? 1 : model.trainCount(unitType)</text>
  <text x="410" y="332" text-anchor="middle" font-size="11" fill="#166534">2 UnitBorn events x 1 spawn each = 2 Zerglings (correct)</text>

  <!-- Arrows -->
  <line x1="100" y1="165" x2="245" y2="120" stroke="#475569" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="150" y1="165" x2="250" y2="135" stroke="#475569" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="285" y1="150" x2="285" y2="170" stroke="#475569" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="375" y1="150" x2="375" y2="170" stroke="#475569" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="320" y1="193" x2="465" y2="115" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <line x1="410" y1="193" x2="465" y2="130" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <line x1="560" y1="150" x2="560" y2="170" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-red)"/>

  <!-- Comparison annotation -->
  <rect x="700" y="90" width="100" height="55" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="750" y="112" text-anchor="middle" font-size="11" fill="#14532d" font-weight="600">Expected</text>
  <text x="750" y="130" text-anchor="middle" font-size="12" fill="#166534" font-weight="700">2 Zerglings</text>
  <text x="748" y="165" text-anchor="middle" font-size="11" fill="#991b1b" font-weight="600">Got: 4</text>
</svg>
