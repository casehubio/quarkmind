<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="'Segoe UI', system-ui, sans-serif">
  <style>
    text { font-size: 13px; fill: #2d3748; }
    .title { font-size: 15px; font-weight: 600; }
    .label { font-size: 11px; fill: #4a5568; }
    .metric { font-size: 12px; font-weight: 600; }
    .patch { fill: #4299e1; opacity: 0.15; stroke: #4299e1; stroke-width: 1.5; }
    .worker-a { fill: #e53e3e; }
    .worker-b { fill: #38a169; }
    .idle { fill: #a0aec0; opacity: 0.4; }
    .active { opacity: 1.0; }
    .timeline { stroke: #cbd5e0; stroke-width: 1; }
    .tick-mark { stroke: #a0aec0; stroke-width: 0.5; }
  </style>

  <!-- Title -->
  <text x="360" y="28" text-anchor="middle" class="title">Single-Occupant vs Multi-Occupant Mining</text>

  <!-- Left panel: Single occupant -->
  <text x="180" y="55" text-anchor="middle" class="metric" fill="#e53e3e">Single Occupant — 400 minerals/min</text>

  <!-- Timeline axis -->
  <line x1="40" y1="80" x2="340" y2="80" class="timeline"/>
  <text x="40" y="75" class="label">tick</text>
  <!-- Tick marks 0-9 -->
  <line x1="70" y1="78" x2="70" y2="82" class="tick-mark"/><text x="70" y="95" text-anchor="middle" class="label">0</text>
  <line x1="100" y1="78" x2="100" y2="82" class="tick-mark"/><text x="100" y="95" text-anchor="middle" class="label">1</text>
  <line x1="130" y1="78" x2="130" y2="82" class="tick-mark"/><text x="130" y="95" text-anchor="middle" class="label">2</text>
  <line x1="160" y1="78" x2="160" y2="82" class="tick-mark"/><text x="160" y="95" text-anchor="middle" class="label">3</text>
  <line x1="190" y1="78" x2="190" y2="82" class="tick-mark"/><text x="190" y="95" text-anchor="middle" class="label">4</text>
  <line x1="220" y1="78" x2="220" y2="82" class="tick-mark"/><text x="220" y="95" text-anchor="middle" class="label">5</text>
  <line x1="250" y1="78" x2="250" y2="82" class="tick-mark"/><text x="250" y="95" text-anchor="middle" class="label">6</text>
  <line x1="280" y1="78" x2="280" y2="82" class="tick-mark"/><text x="280" y="95" text-anchor="middle" class="label">7</text>
  <line x1="310" y1="78" x2="310" y2="82" class="tick-mark"/><text x="310" y="95" text-anchor="middle" class="label">8</text>

  <!-- Worker A: walk(0-2) mine(3-5) walk-back(6-8) -->
  <text x="40" y="118" class="label">Worker A</text>
  <rect x="70" y="105" width="90" height="18" rx="3" fill="#fed7d7"/>
  <text x="115" y="118" text-anchor="middle" class="label" fill="#c53030">walk → mine → return</text>
  <rect x="160" y="105" width="90" height="18" rx="3" class="worker-a" opacity="0.8"/>
  <text x="205" y="118" text-anchor="middle" class="label" fill="white">⛏ mining</text>
  <rect x="250" y="105" width="60" height="18" rx="3" fill="#fed7d7"/>

  <!-- Worker B: walk(0-2) WAIT(3-5) mine(6-8) -->
  <text x="40" y="148" class="label">Worker B</text>
  <rect x="70" y="135" width="90" height="18" rx="3" fill="#c6f6d5"/>
  <text x="115" y="148" text-anchor="middle" class="label" fill="#276749">walk → arrive</text>
  <rect x="160" y="135" width="90" height="18" rx="3" class="idle"/>
  <text x="205" y="148" text-anchor="middle" class="label" fill="#718096">⏳ waiting</text>
  <rect x="250" y="135" width="60" height="18" rx="3" class="worker-b" opacity="0.8"/>
  <text x="280" y="148" text-anchor="middle" class="label" fill="white">⛏</text>

  <!-- Annotation -->
  <text x="180" y="178" text-anchor="middle" class="label" fill="#e53e3e">Worker B idles 3 ticks — half the cycle wasted</text>

  <!-- Right panel: Multi occupant -->
  <text x="540" y="55" text-anchor="middle" class="metric" fill="#38a169">Multi-Occupant — 846 minerals/min</text>

  <!-- Timeline axis -->
  <line x1="400" y1="80" x2="700" y2="80" class="timeline"/>
  <text x="400" y="75" class="label">tick</text>
  <line x1="430" y1="78" x2="430" y2="82" class="tick-mark"/><text x="430" y="95" text-anchor="middle" class="label">0</text>
  <line x1="460" y1="78" x2="460" y2="82" class="tick-mark"/><text x="460" y="95" text-anchor="middle" class="label">1</text>
  <line x1="490" y1="78" x2="490" y2="82" class="tick-mark"/><text x="490" y="95" text-anchor="middle" class="label">2</text>
  <line x1="520" y1="78" x2="520" y2="82" class="tick-mark"/><text x="520" y="95" text-anchor="middle" class="label">3</text>
  <line x1="550" y1="78" x2="550" y2="82" class="tick-mark"/><text x="550" y="95" text-anchor="middle" class="label">4</text>
  <line x1="580" y1="78" x2="580" y2="82" class="tick-mark"/><text x="580" y="95" text-anchor="middle" class="label">5</text>
  <line x1="610" y1="78" x2="610" y2="82" class="tick-mark"/><text x="610" y="95" text-anchor="middle" class="label">6</text>
  <line x1="640" y1="78" x2="640" y2="82" class="tick-mark"/><text x="640" y="95" text-anchor="middle" class="label">7</text>
  <line x1="670" y1="78" x2="670" y2="82" class="tick-mark"/><text x="670" y="95" text-anchor="middle" class="label">8</text>

  <!-- Worker A: walk(0-2) mine(3-4) walk-back(5-7) -->
  <text x="400" y="118" class="label">Worker A</text>
  <rect x="430" y="105" width="90" height="18" rx="3" fill="#fed7d7"/>
  <text x="475" y="118" text-anchor="middle" class="label" fill="#c53030">walk</text>
  <rect x="520" y="105" width="60" height="18" rx="3" class="worker-a" opacity="0.8"/>
  <text x="550" y="118" text-anchor="middle" class="label" fill="white">⛏</text>
  <rect x="580" y="105" width="90" height="18" rx="3" fill="#fed7d7"/>
  <text x="625" y="118" text-anchor="middle" class="label" fill="#c53030">return</text>

  <!-- Worker B: walk(0-2) mine(3-4) walk-back(5-7) — simultaneous -->
  <text x="400" y="148" class="label">Worker B</text>
  <rect x="430" y="135" width="90" height="18" rx="3" fill="#c6f6d5"/>
  <text x="475" y="148" text-anchor="middle" class="label" fill="#276749">walk</text>
  <rect x="520" y="135" width="60" height="18" rx="3" class="worker-b" opacity="0.8"/>
  <text x="550" y="148" text-anchor="middle" class="label" fill="white">⛏</text>
  <rect x="580" y="135" width="90" height="18" rx="3" fill="#c6f6d5"/>
  <text x="625" y="148" text-anchor="middle" class="label" fill="#276749">return</text>

  <!-- Annotation -->
  <text x="540" y="178" text-anchor="middle" class="label" fill="#38a169">Both mine simultaneously — no wasted ticks</text>

  <!-- Bottom comparison -->
  <line x1="40" y1="200" x2="700" y2="200" stroke="#e2e8f0" stroke-width="1"/>

  <text x="360" y="230" text-anchor="middle" class="title">Impact on Mineral Balance</text>

  <rect x="80" y="245" width="240" height="35" rx="6" fill="#fed7d7"/>
  <text x="200" y="268" text-anchor="middle" class="metric" fill="#c53030">Before: -541,000 minerals (debt)</text>

  <text x="360" y="268" text-anchor="middle" font-size="20" fill="#718096">→</text>

  <rect x="400" y="245" width="240" height="35" rx="6" fill="#c6f6d5"/>
  <text x="520" y="268" text-anchor="middle" class="metric" fill="#276749">After: +98,000 minerals (positive)</text>

  <text x="360" y="310" text-anchor="middle" class="label">16 workers, 8 mineral patches, 5-minute checkpoint across 118 SC2 replays</text>
</svg>
