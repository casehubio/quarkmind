<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320">
  <style>
    text { font-family: 'Segoe UI', system-ui, sans-serif; }
    .title { font-size: 14px; font-weight: 600; fill: #1a1a2e; }
    .label { font-size: 11px; fill: #555; }
    .value { font-size: 11px; fill: #1a1a2e; font-weight: 500; }
    .axis { stroke: #ccc; stroke-width: 1; }
    .gridline { stroke: #eee; stroke-width: 0.5; }
    .bar-mode-a { fill: #2563eb; opacity: 0.85; }
    .bar-mode-b { fill: #94a3b8; opacity: 0.85; }
    .bar-em { fill: #f59e0b; opacity: 0.85; }
    .mean-line { stroke: #dc2626; stroke-width: 2; stroke-dasharray: 6,3; }
    .em-line { stroke: #f59e0b; stroke-width: 2; stroke-dasharray: 4,4; }
    .annotation { font-size: 10px; fill: #666; }
    .pct { font-size: 10px; fill: #dc2626; font-weight: 500; }
  </style>

  <text x="360" y="28" text-anchor="middle" class="title">SC2 6w dual-geyser vespene at tick 304 — five recordings</text>

  <!-- Y axis -->
  <line x1="100" y1="50" x2="100" y2="260" class="axis"/>
  <!-- X axis -->
  <line x1="100" y1="260" x2="680" y2="260" class="axis"/>

  <!-- Y gridlines and labels (900-1300) -->
  <line x1="100" y1="60" x2="680" y2="60" class="gridline"/>
  <text x="90" y="64" text-anchor="end" class="label">1300</text>
  <line x1="100" y1="110" x2="680" y2="110" class="gridline"/>
  <text x="90" y="114" text-anchor="end" class="label">1200</text>
  <line x1="100" y1="160" x2="680" y2="160" class="gridline"/>
  <text x="90" y="164" text-anchor="end" class="label">1100</text>
  <line x1="100" y1="210" x2="680" y2="210" class="gridline"/>
  <text x="90" y="214" text-anchor="end" class="label">1000</text>
  <line x1="100" y1="260" x2="680" y2="260" class="gridline"/>
  <text x="90" y="264" text-anchor="end" class="label">900</text>

  <!-- Y axis label -->
  <text x="30" y="160" text-anchor="middle" transform="rotate(-90,30,160)" class="label">Vespene collected</text>

  <!-- Bars: Run 1 (1044), Run 2 (1204), Run 3 (1204), Run 4 (1044), Run 5 (1204), EM (1108) -->
  <!-- Scale: 900=260, 1300=60, so y = 260 - (val-900)/400 * 200 -->
  <!-- 1044: y = 260 - 144/400*200 = 260 - 72 = 188, height = 260-188 = 72 -->
  <!-- 1204: y = 260 - 304/400*200 = 260 - 152 = 108, height = 260-108 = 152 -->
  <!-- 1108: y = 260 - 208/400*200 = 260 - 104 = 156, height = 260-156 = 104 -->

  <!-- Run 1 -->
  <rect x="130" y="188" width="60" height="72" class="bar-mode-b" rx="3"/>
  <text x="160" y="183" text-anchor="middle" class="value">1044</text>
  <text x="160" y="278" text-anchor="middle" class="label">Run 1</text>

  <!-- Run 2 -->
  <rect x="210" y="108" width="60" height="152" class="bar-mode-a" rx="3"/>
  <text x="240" y="103" text-anchor="middle" class="value">1204</text>
  <text x="240" y="278" text-anchor="middle" class="label">Run 2</text>

  <!-- Run 3 -->
  <rect x="290" y="108" width="60" height="152" class="bar-mode-a" rx="3"/>
  <text x="320" y="103" text-anchor="middle" class="value">1204</text>
  <text x="320" y="278" text-anchor="middle" class="label">Run 3</text>

  <!-- Run 4 -->
  <rect x="370" y="188" width="60" height="72" class="bar-mode-b" rx="3"/>
  <text x="400" y="183" text-anchor="middle" class="value">1044</text>
  <text x="400" y="278" text-anchor="middle" class="label">Run 4</text>

  <!-- Run 5 -->
  <rect x="450" y="108" width="60" height="152" class="bar-mode-a" rx="3"/>
  <text x="480" y="103" text-anchor="middle" class="value">1204</text>
  <text x="480" y="278" text-anchor="middle" class="label">Run 5</text>

  <!-- EM bar -->
  <rect x="560" y="156" width="60" height="104" class="bar-em" rx="3"/>
  <text x="590" y="151" text-anchor="middle" class="value">1108</text>
  <text x="590" y="278" text-anchor="middle" class="label">EM</text>

  <!-- Mean line at 1140: y = 260 - 240/400*200 = 260 - 120 = 140 -->
  <line x1="115" y1="140" x2="530" y2="140" class="mean-line"/>
  <text x="535" y="137" class="pct">mean = 1140</text>

  <!-- EM line -->
  <line x1="545" y1="156" x2="635" y2="156" class="em-line"/>

  <!-- Delta annotation -->
  <text x="590" y="143" text-anchor="middle" class="pct">-2.8% vs mean</text>

  <!-- Legend -->
  <rect x="130" y="296" width="12" height="12" class="bar-mode-a" rx="2"/>
  <text x="147" y="307" class="annotation">Mode A (3/5 runs)</text>
  <rect x="280" y="296" width="12" height="12" class="bar-mode-b" rx="2"/>
  <text x="297" y="307" class="annotation">Mode B (2/5 runs)</text>
  <rect x="430" y="296" width="12" height="12" class="bar-em" rx="2"/>
  <text x="447" y="307" class="annotation">Emulated Game</text>
</svg>
