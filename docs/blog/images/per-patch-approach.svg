<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="'Segoe UI', system-ui, sans-serif">
  <style>
    text { font-size: 13px; fill: #333; }
    .title { font-size: 15px; font-weight: 600; fill: #1a1a1a; }
    .label { font-size: 11px; fill: #666; }
    .patch-close { fill: #fbbf24; stroke: #d97706; stroke-width: 1.5; }
    .patch-far { fill: #93c5fd; stroke: #2563eb; stroke-width: 1.5; }
    .nexus { fill: #a78bfa; stroke: #7c3aed; stroke-width: 2; }
    .worker { fill: #34d399; stroke: #059669; stroke-width: 1; }
    .path-close { stroke: #d97706; stroke-width: 1; stroke-dasharray: 4,3; fill: none; }
    .path-far { stroke: #2563eb; stroke-width: 1; stroke-dasharray: 4,3; fill: none; }
    .brace { stroke: #666; stroke-width: 1; fill: none; }
    .annotation { font-size: 11px; fill: #666; }
    .formula { font-size: 12px; fill: #1a1a1a; font-family: 'Courier New', monospace; }
  </style>

  <text x="360" y="24" text-anchor="middle" class="title">Per-Patch Approach Docking</text>
  <text x="360" y="42" text-anchor="middle" class="label">Close patches: more contention, more approach time. Far patches: less.</text>

  <!-- Nexus -->
  <rect x="330" y="120" width="60" height="60" class="nexus" rx="6"/>
  <text x="360" y="156" text-anchor="middle" fill="white" font-size="11" font-weight="600">Nexus</text>

  <!-- Close patches (left cluster) -->
  <rect x="160" y="100" width="24" height="16" class="patch-close" rx="3"/>
  <rect x="140" y="130" width="24" height="16" class="patch-close" rx="3"/>
  <rect x="160" y="160" width="24" height="16" class="patch-close" rx="3"/>
  <rect x="150" y="190" width="24" height="16" class="patch-close" rx="3"/>

  <!-- Far patches (outer) -->
  <rect x="70" y="80" width="24" height="16" class="patch-far" rx="3"/>
  <rect x="50" y="130" width="24" height="16" class="patch-far" rx="3"/>
  <rect x="60" y="175" width="24" height="16" class="patch-far" rx="3"/>
  <rect x="80" y="210" width="24" height="16" class="patch-far" rx="3"/>

  <!-- Workers -->
  <circle cx="210" cy="108" r="5" class="worker"/>
  <circle cx="195" cy="138" r="5" class="worker"/>
  <circle cx="210" cy="168" r="5" class="worker"/>
  <circle cx="200" cy="198" r="5" class="worker"/>
  <circle cx="120" cy="88" r="5" class="worker"/>
  <circle cx="105" cy="138" r="5" class="worker"/>
  <circle cx="110" cy="183" r="5" class="worker"/>
  <circle cx="130" cy="218" r="5" class="worker"/>

  <!-- Paths -->
  <line x1="215" y1="108" x2="330" y2="140" class="path-close"/>
  <line x1="125" y1="88" x2="330" y2="135" class="path-far"/>

  <!-- Right side: cycle time comparison -->
  <text x="470" y="80" class="title" font-size="13">Cycle time spread</text>

  <!-- Close patch bar -->
  <rect x="470" y="100" width="180" height="24" rx="3" fill="#fef3c7" stroke="#d97706"/>
  <text x="480" y="116" font-size="11" fill="#92400e">Close (6.0u): approach = 9.7 loops</text>

  <!-- Uniform bar (reference) -->
  <rect x="470" y="134" width="150" height="24" rx="3" fill="#f3f4f6" stroke="#9ca3af"/>
  <text x="480" y="150" font-size="11" fill="#6b7280">Uniform: approach = 7.0 loops</text>

  <!-- Far patch bar -->
  <rect x="470" y="168" width="120" height="24" rx="3" fill="#dbeafe" stroke="#2563eb"/>
  <text x="480" y="184" font-size="11" fill="#1e40af">Far (7.6u): approach = 5.6 loops</text>

  <!-- Spread annotation -->
  <line x1="660" y1="105" x2="660" y2="187" class="brace"/>
  <line x1="655" y1="105" x2="660" y2="105" class="brace"/>
  <line x1="655" y1="187" x2="660" y2="187" class="brace"/>
  <text x="668" y="150" class="annotation">4.1 loop</text>
  <text x="668" y="163" class="annotation">spread</text>

  <!-- Formula -->
  <text x="470" y="230" class="formula">approach = 7.0 + 2.5 * (avg - dist)</text>
  <text x="470" y="250" class="annotation">Close patches: more mineral-line contention</text>
  <text x="470" y="265" class="annotation">Far patches: less worker traffic, less overhead</text>

  <!-- Legend -->
  <rect x="60" y="260" width="14" height="14" class="patch-close" rx="2"/>
  <text x="80" y="272" class="label">Close patch (6.0u)</text>
  <rect x="200" y="260" width="14" height="14" class="patch-far" rx="2"/>
  <text x="220" y="272" class="label">Far patch (7.6u)</text>
  <circle cx="347" cy="267" r="5" class="worker"/>
  <text x="358" y="272" class="label">Worker</text>
</svg>
