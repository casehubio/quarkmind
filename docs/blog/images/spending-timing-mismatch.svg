<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="system-ui, -apple-system, sans-serif" font-size="13">
  <style>
    .label { font-size: 12px; fill: #555; }
    .heading { font-size: 14px; font-weight: 600; fill: #222; }
    .tick { stroke: #ccc; stroke-width: 1; }
    .axis { stroke: #888; stroke-width: 1.5; }
    .bar-em { fill: #e06050; }
    .bar-gt { fill: #4a9; }
    .bar-progress { fill: #e06050; opacity: 0.35; }
    .arrow { fill: none; stroke: #888; stroke-width: 1.2; marker-end: url(#arrowhead); }
    .note { font-size: 11px; fill: #666; font-style: italic; }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#888"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="360" y="28" text-anchor="middle" class="heading">What SC2 Tracks vs What We Tracked</text>

  <!-- Timeline axis -->
  <line x1="80" y1="70" x2="680" y2="70" class="axis"/>
  <text x="80" y="62" class="label">Training starts</text>
  <text x="420" y="62" class="label">Training completes</text>
  <text x="600" y="62" class="label">Unit dies</text>

  <!-- Tick marks -->
  <line x1="80" y1="65" x2="80" y2="75" class="axis"/>
  <line x1="420" y1="65" x2="420" y2="75" class="axis"/>
  <line x1="600" y1="65" x2="600" y2="75" class="axis"/>

  <!-- Our model row -->
  <text x="20" y="118" class="heading">Our model</text>
  <rect x="80" y="95" width="520" height="30" rx="3" class="bar-em"/>
  <text x="90" y="115" fill="white" font-size="12" font-weight="500">Cost recorded at start → spending visible immediately</text>

  <!-- SC2 InProgress row -->
  <text x="20" y="168" class="heading" font-size="13">SC2</text>
  <text x="20" y="182" class="label">InProgress</text>
  <rect x="80" y="155" width="340" height="24" rx="3" class="bar-progress"/>
  <text x="90" y="172" fill="#a44" font-size="11">In-progress (not in "Current")</text>

  <!-- SC2 Current row -->
  <text x="20" y="222" class="label">Current</text>
  <rect x="420" y="205" width="180" height="24" rx="3" class="bar-gt"/>
  <text x="430" y="222" fill="white" font-size="11">Completed + alive</text>

  <!-- Snapshot line -->
  <line x1="300" y1="85" x2="300" y2="245" stroke="#c44" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="300" y="265" text-anchor="middle" fill="#c44" font-size="12" font-weight="600">Snapshot at checkpoint</text>

  <!-- Annotations -->
  <path d="M300,105 L315,105" class="arrow"/>
  <text x="320" y="109" class="note">We see cost here</text>

  <path d="M300,215 L315,215" class="arrow"/>
  <text x="320" y="219" class="note">SC2 sees nothing — unit not done yet</text>

  <!-- Legend -->
  <rect x="80" y="290" width="14" height="14" rx="2" class="bar-em"/>
  <text x="100" y="302" class="label">Our recorded spending</text>
  <rect x="260" y="290" width="14" height="14" rx="2" class="bar-gt"/>
  <text x="280" y="302" class="label">SC2 "Current" (completed + alive)</text>
  <rect x="480" y="290" width="14" height="14" rx="2" class="bar-progress"/>
  <text x="500" y="302" class="label">SC2 "InProgress"</text>
</svg>
