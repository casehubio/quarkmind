<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 420" font-family="'Segoe UI', system-ui, sans-serif">
  <style>
    text { font-size: 13px; fill: #2d3748; }
    .title { font-size: 15px; font-weight: 600; }
    .label { font-size: 11px; fill: #4a5568; }
    .small { font-size: 10px; fill: #718096; }
    .bar-old { fill: #4299e1; }
    .bar-fix { fill: #f56565; }
    .bar-target { fill: #48bb78; opacity: 0.3; }
    .axis { stroke: #a0aec0; stroke-width: 1; }
    .gridline { stroke: #e2e8f0; stroke-width: 0.5; }
    .legend-box { rx: 3; ry: 3; }
  </style>

  <text x="370" y="28" text-anchor="middle" class="title">mineralsCollectionRate MAPE — Five Approaches vs Original</text>

  <!-- Legend -->
  <rect x="160" y="44" width="12" height="12" class="bar-old legend-box"/>
  <text x="178" y="55" class="label">Original discrete model</text>
  <rect x="340" y="44" width="12" height="12" class="bar-fix legend-box"/>
  <text x="358" y="55" class="label">Best attempted fix</text>
  <rect x="520" y="44" width="12" height="12" class="bar-target legend-box"/>
  <text x="538" y="55" class="label">Ground truth (0% = perfect)</text>

  <!-- Axes -->
  <line x1="100" y1="80" x2="100" y2="380" class="axis"/>
  <line x1="100" y1="380" x2="700" y2="380" class="axis"/>

  <!-- Y-axis labels and gridlines -->
  <line x1="100" y1="80" x2="700" y2="80" class="gridline"/>
  <text x="90" y="84" text-anchor="end" class="small">50%</text>
  <line x1="100" y1="140" x2="700" y2="140" class="gridline"/>
  <text x="90" y="144" text-anchor="end" class="small">40%</text>
  <line x1="100" y1="200" x2="700" y2="200" class="gridline"/>
  <text x="90" y="204" text-anchor="end" class="small">30%</text>
  <line x1="100" y1="260" x2="700" y2="260" class="gridline"/>
  <text x="90" y="264" text-anchor="end" class="small">20%</text>
  <line x1="100" y1="320" x2="700" y2="320" class="gridline"/>
  <text x="90" y="324" text-anchor="end" class="small">10%</text>
  <text x="90" y="384" text-anchor="end" class="small">0%</text>

  <!-- Y-axis title -->
  <text x="30" y="230" text-anchor="middle" transform="rotate(-90, 30, 230)" class="label">MAPE (%)</text>

  <!-- Checkpoint groups -->
  <!-- 1-min -->
  <text x="195" y="400" text-anchor="middle" class="label">1 min</text>
  <rect x="155" y="318.8" width="35" height="61.2" class="bar-old" rx="2"/>
  <text x="172" y="314" text-anchor="middle" class="small">10.2%</text>
  <rect x="200" y="336.2" width="35" height="43.8" class="bar-fix" rx="2"/>
  <text x="217" y="332" text-anchor="middle" class="small">7.3%</text>

  <!-- 3-min -->
  <text x="345" y="400" text-anchor="middle" class="label">3 min</text>
  <rect x="305" y="295.4" width="35" height="84.6" class="bar-old" rx="2"/>
  <text x="322" y="291" text-anchor="middle" class="small">14.1%</text>
  <rect x="350" y="225.2" width="35" height="154.8" class="bar-fix" rx="2"/>
  <text x="367" y="221" text-anchor="middle" class="small">25.8%</text>

  <!-- 5-min -->
  <text x="495" y="400" text-anchor="middle" class="label">5 min</text>
  <rect x="455" y="294.8" width="35" height="85.2" class="bar-old" rx="2"/>
  <text x="472" y="290" text-anchor="middle" class="small">14.2%</text>
  <rect x="500" y="284.6" width="35" height="95.4" class="bar-fix" rx="2"/>
  <text x="517" y="280" text-anchor="middle" class="small">15.9%</text>

  <!-- 7-min -->
  <text x="645" y="400" text-anchor="middle" class="label">7 min</text>
  <rect x="605" y="296.6" width="35" height="83.4" class="bar-old" rx="2"/>
  <text x="622" y="292" text-anchor="middle" class="small">13.9%</text>
  <rect x="650" y="268.6" width="35" height="111.4" class="bar-fix" rx="2"/>
  <text x="667" y="264" text-anchor="middle" class="small">18.6%</text>

  <!-- Annotation -->
  <text x="400" y="415" text-anchor="middle" class="small">Checkpoint (game time)</text>
</svg>
