<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280">
  <defs>
    <style>
      text { font-family: 'Inter', 'Segoe UI', sans-serif; }
      .title { font-size: 14px; font-weight: 600; fill: #1a1a2e; }
      .label { font-size: 11px; fill: #555; }
      .value { font-size: 24px; font-weight: 700; }
      .sub { font-size: 10px; fill: #888; }
      .box { rx: 8; ry: 8; stroke-width: 2; }
      .main-before { fill: #fff3e0; stroke: #e8a838; }
      .exp-before { fill: #f5f5f5; stroke: #ccc; }
      .main-after { fill: #e8f5e9; stroke: #5cb85c; }
      .exp-after { fill: #e3f2fd; stroke: #4a90d9; }
      .arrow { fill: none; stroke: #d9534f; stroke-width: 2; marker-end: url(#arrowhead); }
      .dim { font-size: 10px; fill: #999; }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d9534f"/>
    </marker>
  </defs>

  <text x="340" y="24" text-anchor="middle" class="title">Worker Distribution: Before and After Expansion Transfer</text>

  <!-- BEFORE -->
  <text x="170" y="55" text-anchor="middle" class="label" font-weight="600">Before</text>

  <!-- Main base before -->
  <rect x="50" y="70" width="140" height="100" class="box main-before"/>
  <text x="120" y="100" text-anchor="middle" class="label">Main Base</text>
  <text x="120" y="135" text-anchor="middle" class="value" fill="#e8a838">20</text>
  <text x="120" y="155" text-anchor="middle" class="sub">workers (optimal: 16)</text>

  <!-- Expansion before -->
  <rect x="210" y="70" width="110" height="100" class="box exp-before"/>
  <text x="265" y="100" text-anchor="middle" class="label">Expansion</text>
  <text x="265" y="135" text-anchor="middle" class="value" fill="#ccc">0</text>
  <text x="265" y="155" text-anchor="middle" class="sub">workers</text>

  <!-- Oversaturated indicator -->
  <text x="120" y="188" text-anchor="middle" class="dim">4 workers earning ~10% each</text>
  <text x="265" y="188" text-anchor="middle" class="dim">8 patches idle</text>

  <!-- AFTER -->
  <text x="510" y="55" text-anchor="middle" class="label" font-weight="600">After</text>

  <!-- Main base after -->
  <rect x="390" y="70" width="140" height="100" class="box main-after"/>
  <text x="460" y="100" text-anchor="middle" class="label">Main Base</text>
  <text x="460" y="135" text-anchor="middle" class="value" fill="#5cb85c">16</text>
  <text x="460" y="155" text-anchor="middle" class="sub">workers (optimal)</text>

  <!-- Expansion after -->
  <rect x="550" y="70" width="110" height="100" class="box exp-after"/>
  <text x="605" y="100" text-anchor="middle" class="label">Expansion</text>
  <text x="605" y="135" text-anchor="middle" class="value" fill="#4a90d9">4</text>
  <text x="605" y="155" text-anchor="middle" class="sub">transferred</text>

  <!-- Arrow -->
  <path d="M330,120 C355,120 365,120 380,120" class="arrow"/>
  <text x="355" y="112" text-anchor="middle" class="dim">transfer</text>

  <!-- Bottom summary -->
  <rect x="50" y="210" width="270" height="50" rx="6" fill="#fff8e1" stroke="#e8a838" stroke-width="1"/>
  <text x="185" y="232" text-anchor="middle" class="label">Workers 17-20 earn 0.128/tick each</text>
  <text x="185" y="248" text-anchor="middle" class="sub">Diminishing returns — 10% of first-worker rate</text>

  <rect x="370" y="210" width="290" height="50" rx="6" fill="#e8f5e9" stroke="#5cb85c" stroke-width="1"/>
  <text x="515" y="232" text-anchor="middle" class="label">Transferred workers earn 1.272/tick each</text>
  <text x="515" y="248" text-anchor="middle" class="sub">Full first-worker rate on fresh patches</text>
</svg>
