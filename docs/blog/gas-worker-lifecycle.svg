<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 280" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="a1" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#475569"/>
    </marker>
    <marker id="a2" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#ef4444"/>
    </marker>
    <marker id="a3" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#10b981"/>
    </marker>
  </defs>

  <style>
    .title { font-size: 14px; font-weight: 600; fill: #1e293b; }
    .node { rx: 8; stroke-width: 2; }
    .lbl { font-size: 11px; fill: #1e293b; text-anchor: middle; }
    .ann { font-size: 10px; fill: #64748b; font-style: italic; }
  </style>

  <text x="350" y="24" text-anchor="middle" class="title">Gas Worker Death — Before and After rebalanceGasWorkers()</text>

  <!-- BEFORE row -->
  <text x="20" y="80" font-size="12" font-weight="600" fill="#475569">Before</text>

  <!-- Gas slot: 3 workers -->
  <rect x="90" y="55" width="120" height="45" class="node" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="150" y="73" class="lbl">Gas Slot</text>
  <text x="150" y="88" class="lbl" font-size="10" fill="#3b82f6">3 workers</text>

  <!-- Arrow: worker dies -->
  <line x1="210" y1="77" x2="280" y2="77" stroke="#ef4444" stroke-width="2" marker-end="url(#a2)"/>
  <text x="245" y="70" font-size="10" fill="#ef4444" text-anchor="middle">worker dies</text>

  <!-- Gas slot: 2 workers -->
  <rect x="285" y="55" width="120" height="45" class="node" fill="#fee2e2" stroke="#ef4444"/>
  <text x="345" y="73" class="lbl">Gas Slot</text>
  <text x="345" y="88" class="lbl" font-size="10" fill="#ef4444">2 workers</text>

  <!-- Arrow: forever -->
  <line x1="405" y1="77" x2="490" y2="77" stroke="#ef4444" stroke-width="2" marker-end="url(#a2)" stroke-dasharray="6,3"/>
  <text x="448" y="70" font-size="10" fill="#ef4444" text-anchor="middle">permanent</text>

  <!-- Gas slot: 2 workers still -->
  <rect x="495" y="55" width="140" height="45" class="node" fill="#fee2e2" stroke="#ef4444"/>
  <text x="565" y="73" class="lbl">Gas Slot</text>
  <text x="565" y="88" class="lbl" font-size="10" fill="#ef4444">2 workers forever</text>

  <!-- Annotation -->
  <text x="565" y="115" class="ann" text-anchor="middle">rebalanceGasWorkers() exists but is never called</text>

  <!-- Separator -->
  <line x1="80" y1="140" x2="660" y2="140" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- AFTER row -->
  <text x="20" y="195" font-size="12" font-weight="600" fill="#475569">After</text>

  <!-- Gas slot: 3 workers -->
  <rect x="90" y="170" width="120" height="45" class="node" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="150" y="188" class="lbl">Gas Slot</text>
  <text x="150" y="203" class="lbl" font-size="10" fill="#3b82f6">3 workers</text>

  <!-- Arrow: worker dies -->
  <line x1="210" y1="192" x2="280" y2="192" stroke="#ef4444" stroke-width="2" marker-end="url(#a2)"/>
  <text x="245" y="185" font-size="10" fill="#ef4444" text-anchor="middle">worker dies</text>

  <!-- Gas slot: 2 workers -->
  <rect x="285" y="170" width="120" height="45" class="node" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="345" y="188" class="lbl">Gas Slot</text>
  <text x="345" y="203" class="lbl" font-size="10" fill="#f59e0b">2 workers</text>

  <!-- Arrow: rebalance -->
  <line x1="405" y1="192" x2="490" y2="192" stroke="#10b981" stroke-width="2" marker-end="url(#a3)"/>
  <text x="448" y="185" font-size="10" fill="#10b981" text-anchor="middle">rebalance</text>

  <!-- Gas slot: 3 workers restored -->
  <rect x="495" y="170" width="140" height="45" class="node" fill="#d1fae5" stroke="#10b981"/>
  <text x="565" y="188" class="lbl">Gas Slot</text>
  <text x="565" y="203" class="lbl" font-size="10" fill="#10b981">3 workers restored</text>

  <!-- Mineral worker annotation -->
  <rect x="440" y="230" width="200" height="30" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <text x="540" y="250" class="lbl" font-size="10" fill="#64748b">mineral worker transferred to gas</text>
  <line x1="540" y1="230" x2="540" y2="215" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,2"/>
</svg>
