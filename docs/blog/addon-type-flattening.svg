<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 340" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#64748b"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#dc2626"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="390" y="28" text-anchor="middle" font-size="15" font-weight="600" fill="#1e293b">Type Flattening: How Add-On Variants Lose Their Cost Identity</text>

  <!-- Source event -->
  <rect x="20" y="55" width="160" height="48" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="100" y="75" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">UnitInit</text>
  <text x="100" y="92" text-anchor="middle" font-size="11" fill="#64748b">"BarracksReactor"</text>

  <!-- Arrow to toBuildingType -->
  <line x1="180" y1="79" x2="218" y2="79" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- toBuildingType box -->
  <rect x="220" y="55" width="160" height="48" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="300" y="75" text-anchor="middle" font-size="12" font-weight="600" fill="#3730a3">toBuildingType()</text>
  <text x="300" y="92" text-anchor="middle" font-size="11" fill="#6366f1">→ BARRACKS</text>

  <!-- Arrow to cost lookup -->
  <line x1="380" y1="79" x2="418" y2="79" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Cost lookup (WRONG) -->
  <rect x="420" y="45" width="175" height="68" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="507" y="66" text-anchor="middle" font-size="12" font-weight="600" fill="#991b1b">SC2Data.cost(BARRACKS)</text>
  <text x="507" y="84" text-anchor="middle" font-size="13" font-weight="700" fill="#dc2626">150m / 0g</text>
  <text x="507" y="103" text-anchor="middle" font-size="10" fill="#991b1b">parent cost, not add-on cost</text>

  <!-- Deduction arrow -->
  <line x1="595" y1="79" x2="633" y2="79" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow-red)"/>

  <!-- Result (WRONG) -->
  <rect x="635" y="55" width="130" height="48" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="700" y="75" text-anchor="middle" font-size="12" font-weight="600" fill="#991b1b">Over-deducts</text>
  <text x="700" y="92" text-anchor="middle" font-size="12" fill="#dc2626">+100m per add-on</text>

  <!-- Divider -->
  <line x1="30" y1="135" x2="750" y2="135" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="6,4"/>
  <text x="390" y="160" text-anchor="middle" font-size="13" font-weight="600" fill="#16a34a">Fix: AddonKind enum preserves cost identity through the pipeline</text>

  <!-- Fixed flow -->
  <!-- Source event -->
  <rect x="20" y="182" width="160" height="48" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="100" y="202" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">UnitInit</text>
  <text x="100" y="219" text-anchor="middle" font-size="11" fill="#64748b">"BarracksReactor"</text>

  <!-- Arrow to detect -->
  <line x1="180" y1="206" x2="218" y2="206" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Addon detection -->
  <rect x="220" y="178" width="160" height="56" rx="6" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.5"/>
  <text x="300" y="198" text-anchor="middle" font-size="12" font-weight="600" fill="#166534">addonKind()</text>
  <text x="300" y="214" text-anchor="middle" font-size="11" fill="#16a34a">→ REACTOR</text>
  <text x="300" y="228" text-anchor="middle" font-size="10" fill="#166534">+ toBuildingType → BARRACKS</text>

  <!-- Arrow to cost -->
  <line x1="380" y1="206" x2="418" y2="206" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <!-- Correct cost -->
  <rect x="420" y="178" width="175" height="56" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="507" y="198" text-anchor="middle" font-size="12" font-weight="600" fill="#166534">AddonKind.REACTOR</text>
  <text x="507" y="216" text-anchor="middle" font-size="13" font-weight="700" fill="#16a34a">50m / 50g</text>
  <text x="507" y="230" text-anchor="middle" font-size="10" fill="#166534">actual SC2 add-on cost</text>

  <!-- Arrow to result -->
  <line x1="595" y1="206" x2="633" y2="206" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <!-- Result (CORRECT) -->
  <rect x="635" y="182" width="130" height="48" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="700" y="202" text-anchor="middle" font-size="12" font-weight="600" fill="#166534">Correct</text>
  <text x="700" y="219" text-anchor="middle" font-size="12" fill="#16a34a">deduction</text>

  <!-- Cost table -->
  <text x="390" y="268" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">SC2 Add-On Costs (all production buildings)</text>

  <rect x="160" y="280" width="460" height="24" rx="0" fill="#f8fafc"/>
  <text x="275" y="296" text-anchor="middle" font-size="11" font-weight="600" fill="#334155">Reactor</text>
  <text x="435" y="296" text-anchor="middle" font-size="11" fill="#334155">50 minerals / 50 gas</text>

  <rect x="160" y="304" width="460" height="24" rx="0" fill="#f1f5f9"/>
  <text x="275" y="320" text-anchor="middle" font-size="11" font-weight="600" fill="#334155">TechLab</text>
  <text x="435" y="320" text-anchor="middle" font-size="11" fill="#334155">50 minerals / 25 gas</text>

  <rect x="160" y="280" width="460" height="48" rx="4" fill="none" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="355" y1="280" x2="355" y2="328" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="160" y1="304" x2="620" y2="304" stroke="#cbd5e1" stroke-width="1"/>
</svg>
