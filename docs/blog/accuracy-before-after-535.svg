<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 280">
  <style>
    text { font-family: 'Segoe UI', system-ui, sans-serif; }
    .title { font-size: 14px; fill: #333; font-weight: 600; }
    .label { font-size: 12px; fill: #555; }
    .value { font-size: 12px; font-weight: 600; }
    .before { fill: #ef4444; }
    .after { fill: #16a34a; }
    .bar-before { fill: #fca5a5; stroke: #ef4444; stroke-width: 1; }
    .bar-after { fill: #bbf7d0; stroke: #16a34a; stroke-width: 1; }
    .axis { stroke: #ccc; stroke-width: 1; }
    .grid { stroke: #f0f0f0; stroke-width: 0.5; }
    .tag { font-size: 10px; fill: #999; }
  </style>

  <text class="title" x="200" y="25">Building Accuracy — Before and After GT Fix</text>
  <text class="tag" x="240" y="42">118 oracle replays, 236 player runs</text>

  <!-- Legend -->
  <rect class="bar-before" x="430" y="15" width="14" height="10" rx="2"/>
  <text class="label" x="450" y="24">Before</text>
  <rect class="bar-after" x="500" y="15" width="14" height="10" rx="2"/>
  <text class="label" x="520" y="24">After</text>

  <!-- Y axis -->
  <line class="axis" x1="120" y1="60" x2="120" y2="260"/>
  <line class="axis" x1="120" y1="260" x2="600" y2="260"/>

  <!-- Grid lines -->
  <line class="grid" x1="120" y1="260" x2="600" y2="260"/>
  <line class="grid" x1="120" y1="210" x2="600" y2="210"/>
  <line class="grid" x1="120" y1="160" x2="600" y2="160"/>
  <line class="grid" x1="120" y1="110" x2="600" y2="110"/>
  <line class="grid" x1="120" y1="60" x2="600" y2="60"/>
  <text class="tag" x="105" y="264" text-anchor="end">0%</text>
  <text class="tag" x="105" y="214" text-anchor="end">25%</text>
  <text class="tag" x="105" y="164" text-anchor="end">50%</text>
  <text class="tag" x="105" y="114" text-anchor="end">75%</text>
  <text class="tag" x="105" y="64" text-anchor="end">100%</text>

  <!-- CC 3-min -->
  <text class="label" x="162" y="275" text-anchor="middle">CC 3m</text>
  <rect class="bar-before" x="140" y="170.6" width="20" height="89.4" rx="2"/>
  <rect class="bar-after" x="165" y="60" width="20" height="200" rx="2"/>
  <text class="value before" x="150" y="166" text-anchor="middle">44.7%</text>
  <text class="value after" x="175" y="56" text-anchor="middle">100%</text>

  <!-- CC 5-min -->
  <text class="label" x="242" y="275" text-anchor="middle">CC 5m</text>
  <rect class="bar-before" x="220" y="221" width="20" height="39" rx="2"/>
  <rect class="bar-after" x="245" y="60" width="20" height="200" rx="2"/>
  <text class="value before" x="230" y="217" text-anchor="middle">19.5%</text>
  <text class="value after" x="255" y="56" text-anchor="middle">100%</text>

  <!-- CC 7-min -->
  <text class="label" x="322" y="275" text-anchor="middle">CC 7m</text>
  <rect class="bar-before" x="300" y="228.6" width="20" height="31.4" rx="2"/>
  <rect class="bar-after" x="325" y="60" width="20" height="200" rx="2"/>
  <text class="value before" x="310" y="224" text-anchor="middle">15.7%</text>
  <text class="value after" x="335" y="56" text-anchor="middle">100%</text>

  <!-- Hatch 5-min -->
  <text class="label" x="412" y="275" text-anchor="middle">Hatch 5m</text>
  <rect class="bar-before" x="390" y="89.6" width="20" height="170.4" rx="2"/>
  <rect class="bar-after" x="415" y="60" width="20" height="200" rx="2"/>
  <text class="value before" x="400" y="86" text-anchor="middle">85.2%</text>
  <text class="value after" x="425" y="56" text-anchor="middle">100%</text>

  <!-- Hatch 7-min -->
  <text class="label" x="492" y="275" text-anchor="middle">Hatch 7m</text>
  <rect class="bar-before" x="470" y="132" width="20" height="128" rx="2"/>
  <rect class="bar-after" x="495" y="60" width="20" height="200" rx="2"/>
  <text class="value before" x="480" y="128" text-anchor="middle">64.0%</text>
  <text class="value after" x="505" y="56" text-anchor="middle">100%</text>

  <!-- Nexus -->
  <text class="label" x="565" y="275" text-anchor="middle">Nexus</text>
  <rect class="bar-before" x="545" y="60" width="20" height="200" rx="2"/>
  <rect class="bar-after" x="570" y="60" width="20" height="200" rx="2"/>
  <text class="value" x="557" y="56" text-anchor="middle" fill="#666">100%</text>
</svg>
