name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      # Published blocks-ui 0.3 requires this parent, absent from GitHub Packages.
      - name: Check out CaseHub parent 0.3
        uses: actions/checkout@v4
        with:
          repository: casehubio/parent
          ref: a5766dfb227917c72ba681dc2971b780fd1fab00 # v0.3
          path: .ci/casehub-parent

      - name: Install CaseHub parent 0.3
        run: mvn --batch-mode -N -f .ci/casehub-parent/pom.xml install

      - name: Build and test
        run: mvn --batch-mode verify
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to GitHub Packages
        if: github.event_name != 'pull_request'
        run: mvn --batch-mode deploy -DskipTests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
