[project]
name = "quarkmind-dataset"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "yt-dlp>=2024.0",
    "webvtt-py>=0.5",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
api = ["google-api-python-client>=2.100"]

[tool.pytest.ini_options]
testpaths = ["tests"]
