playbook: cal-mineral-baseline-terran
schema: sc2
meta:
  race: TERRAN
  duration: 305 ticks
  purpose: Terran per-worker mineral rate — 12 SCVs, no gas, no buildings, no training

steps:
  # No actions — starting 12 SCVs mine. Compare to Protoss baseline to see if
  # Terran workers mine at a different rate (they shouldn't, but factor 1.28 is suspicious).

  - assert: tick-61
    at: 61 ticks
    expect:
      units:
        SCV: { min: 12, max: 12 }

  - assert: tick-122
    at: 122 ticks
    expect:
      units:
        SCV: { min: 12, max: 12 }

  - assert: tick-183
    at: 183 ticks
    expect:
      units:
        SCV: { min: 12, max: 12 }

  - assert: tick-244
    at: 244 ticks
    expect:
      units:
        SCV: { min: 12, max: 12 }

  - assert: tick-305
    at: 305 ticks
    expect:
      units:
        SCV: { min: 12, max: 12 }
