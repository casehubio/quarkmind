playbook: cal-gas-dual-6w
schema: sc2
meta:
  race: PROTOSS
  duration: 305 ticks
  purpose: Dual geyser — 6 workers on gas (3 per geyser), rest on minerals

steps:
  - train: PROBE
    loop: continuous

  - build: PYLON
    at: 14 supply

  - build: ASSIMILATOR
    at: 15 supply

  - build: ASSIMILATOR
    at: 16 supply

  - build: PYLON
    at: 22 supply

  - assert: tick-122
    at: 122 ticks
    expect:
      buildings:
        ASSIMILATOR: { min: 2 }

  - assert: tick-183
    at: 183 ticks
    expect:
      vespene:
        min: 50

  - assert: tick-305
    at: 305 ticks
    expect:
      vespene:
        min: 150
