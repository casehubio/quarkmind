playbook: cal-single-base-probes
schema: sc2
meta:
  race: PROTOSS
  duration: 305 ticks
  purpose: Single-base continuous probe production — isolates the pylon/probe feedback loop on one base, no chrono, no expansion, no gas

steps:
  - train: PROBE
    loop: continuous

  - build: PYLON
    at: 14 supply

  - build: PYLON
    at: 22 supply

  - build: PYLON
    at: 30 supply

  - build: PYLON
    at: 38 supply

  - assert: tick-61
    at: 61 ticks
    expect:
      units:
        PROBE: { min: 14 }

  - assert: tick-122
    at: 122 ticks
    expect:
      units:
        PROBE: { min: 18 }

  - assert: tick-183
    at: 183 ticks
    expect:
      units:
        PROBE: { min: 22 }

  - assert: tick-244
    at: 244 ticks
    expect:
      units:
        PROBE: { min: 26 }

  - assert: tick-305
    at: 305 ticks
    expect:
      units:
        PROBE: { min: 30 }
